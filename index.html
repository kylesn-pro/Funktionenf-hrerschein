<meta charset="UTF-8">
<title>Funktionenführerschein</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ============================================================
   Funktionenführerschein, Kurs 11L
   Farbwelt wie beim Potenzführerschein: Petrol auf dunklem Grund
   ============================================================ */
:root{
  color-scheme:dark;
  --ground:#0A1419; --surface:#15242D; --surface-2:#1B2E38; --surface-3:#233842;
  --line:#2E444F; --line-soft:#233640;
  --ink:#E9F1F4; --ink-2:#AFC4CE; --ink-3:#8AA2AE;
  --accent:#4FBAC7; --accent-2:#7ED3DD; --accent-ink:#06181C; --accent-wash:#133540;
  --ok:#5EBE88; --ok-wash:#123222; --warn:#D8A343; --warn-wash:#342710; --bad:#E1746B; --bad-wash:#361A1B;
  --c1:#4FBAC7; --c2:#E0AC4E; --c3:#E1746B; --c4:#A98BE0; --c5:#7FCB8E;
  --grid:#2B4552; --grid-strong:#7F9BA8; --plot-bg:#0F1D24;
  --shadow:0 1px 2px rgba(0,0,0,.42), 0 14px 36px rgba(0,0,0,.46); --shadow-s:0 1px 2px rgba(0,0,0,.45);
  --r:14px; --r-s:9px;
  --f-ui:"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --f-mono:"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --f-math:"Cambria Math","STIX Two Math","Times New Roman",serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{overflow-x:hidden;}
body{background:var(--ground);color:var(--ink);font-family:var(--f-ui);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%;min-height:100vh;}
h1,h2,h3,h4{font-family:var(--f-ui);font-weight:700;margin:0;letter-spacing:-.012em;}
p{margin:0;}
button{font:inherit;color:inherit;}
button,[data-act],.segb,.handle{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px;}
.wrap{max-width:960px;margin:0 auto;padding:0 clamp(12px,3vw,24px);}

/* ---------- Kopfleiste ---------- */
.topbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow-s);}
.topbar-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 0 0;}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;}
.brand-mark{width:38px;height:38px;flex:0 0 38px;border-radius:10px;background:#10606D;display:block;padding:6px;}
.brand-t{display:flex;flex-direction:column;line-height:1.1;}
.brand-t b{font-size:19px;font-weight:700;letter-spacing:-.02em;}
.brand-t span{font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);}
.nav{display:flex;gap:4px;flex-wrap:wrap;}
.nav button{background:transparent;border:1px solid transparent;border-radius:99px;padding:8px 14px;min-height:40px;font-weight:600;font-size:14.5px;color:var(--ink-2);}
.nav button:hover{background:var(--surface-2);color:var(--ink);}
.nav button.on{background:var(--accent-wash);color:var(--accent-2);border-color:var(--accent);}
.readi{display:flex;align-items:center;gap:12px;padding:9px 0 11px;}
.readi-l{font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;}
.readi-track{flex:1;height:12px;border-radius:99px;background:var(--surface-3);border:1px solid var(--line);overflow:hidden;position:relative;min-width:90px;}
.readi-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px;transition:width .55s cubic-bezier(.22,.61,.36,1);}
.readi-track.pass .readi-fill{background:var(--ok);}
.readi-mark{position:absolute;top:-3px;bottom:-3px;left:80%;width:2px;background:var(--ink-3);opacity:.55;}
.readi-v{font-family:var(--f-mono);font-weight:600;font-size:15px;min-width:52px;text-align:right;font-variant-numeric:tabular-nums;}

/* ---------- Karten ---------- */
main{padding:22px 0 64px;}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:clamp(16px,3vw,26px);margin-bottom:18px;}
.card.flat{box-shadow:var(--shadow-s);}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px;}
.lead{color:var(--ink-2);max-width:62ch;}
.note{font-size:14px;color:var(--ink-3);line-height:1.5;}

/* ---------- Bühne ---------- */
.hero{position:relative;overflow:hidden;background:radial-gradient(125% 145% at 14% 0%,#1C4451 0%,#0E2029 62%);border-radius:var(--r);border:1px solid #23495A;margin-bottom:18px;box-shadow:0 1px 2px rgba(0,0,0,.4),0 20px 48px rgba(0,0,0,.5);isolation:isolate;}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0;}
.hero::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(100deg,#0E2029 4%,rgba(14,32,41,.86) 36%,rgba(14,32,41,.12) 64%,rgba(14,32,41,0) 80%);}
.hero-in{position:relative;z-index:2;display:flex;align-items:center;gap:clamp(18px,4vw,40px);flex-wrap:wrap;padding:clamp(22px,4vw,38px) clamp(20px,4vw,36px);}
.hero-txt{flex:1 1 300px;min-width:240px;}
.hero-eyebrow{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#3ED8E8;margin-bottom:12px;border:1px solid rgba(62,216,232,.32);border-radius:99px;padding:4px 11px;}
.hero h2{color:#EAF4F6;font-size:clamp(26px,5vw,40px);line-height:1.08;letter-spacing:-.022em;margin-bottom:10px;}
.hero p{color:#8FB3BC;max-width:46ch;font-size:16px;}
.hero-acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;}
.hero-dial{flex:0 0 auto;margin:0 auto;position:relative;}
.hero-dial::before{content:'';position:absolute;inset:-16px;border-radius:50%;z-index:-1;background:radial-gradient(closest-side,rgba(14,32,41,.92) 42%,rgba(14,32,41,0) 100%);}

/* ---------- Bereiche und Typen ---------- */
.catrow{display:grid;grid-template-columns:minmax(160px,1.2fr) minmax(70px,2fr) auto auto;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line-soft);}
.catrow:first-child{border-top:0;}
.catrow .cn{font-weight:600;font-size:15.5px;}
.catrow .cn small{display:block;font-weight:400;font-size:12.5px;color:var(--ink-3);line-height:1.3;}
.pct{font-family:var(--f-mono);font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:42px;text-align:right;}
.badge{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;}
.badge.ok{background:var(--ok-wash);color:var(--ok);}
.badge.warn{background:var(--warn-wash);color:var(--warn);}
.badge.wait{background:var(--surface-2);color:var(--ink-3);}
.seg{display:flex;gap:2px;height:14px;position:relative;}
.seg i{flex:1;border-radius:2px;background:var(--surface-3);border:1px solid var(--line-soft);}
.seg i.on{background:var(--accent);border-color:var(--accent);}
.seg.pass i.on{background:var(--ok);border-color:var(--ok);}
.seg .mark{position:absolute;top:-4px;bottom:-4px;left:80%;width:2px;background:var(--warn);opacity:.75;border-radius:2px;}
.stamped{animation:stamp .5s cubic-bezier(.2,1.5,.4,1) both;}
@keyframes stamp{0%{transform:scale(2.4) rotate(-9deg);opacity:0;}60%{opacity:1;}100%{transform:scale(1) rotate(-3deg);opacity:1;}}

.typegroup{margin-top:18px;}
.typegroup h3{font-size:15px;color:var(--ink-2);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.typegroup h3 .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);}
.typegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(210px,100%),1fr));gap:9px;}
.typegrid > *{min-width:0;}
.tile{display:flex;align-items:center;gap:10px;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;min-height:56px;transition:border-color .15s,transform .15s;}
.tile:hover{border-color:var(--accent);transform:translateY(-1px);}
.tile .code{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--accent-2);background:var(--accent-wash);border-radius:6px;padding:3px 6px;flex:0 0 auto;}
.tile .tn{flex:1;min-width:0;font-size:14.5px;line-height:1.3;overflow-wrap:break-word;hyphens:auto;}
.tile .cnt{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);flex:0 0 auto;text-align:right;line-height:1.2;}
.tile .cnt b{display:block;font-size:15px;color:var(--ink);}

.levelpick{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.levelpick button{background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:8px 15px;min-height:44px;font-weight:600;font-size:14px;color:var(--ink-2);display:flex;align-items:center;gap:8px;}
.levelpick button.on{background:var(--accent-wash);border-color:var(--accent);color:var(--accent-2);}
.lvl{display:inline-flex;gap:3px;align-items:flex-end;height:14px;}
.lvl i{display:block;width:5px;border-radius:2px;background:var(--surface-3);border:1px solid var(--line);}
.lvl i:nth-child(1){height:6px;} .lvl i:nth-child(2){height:10px;} .lvl i:nth-child(3){height:14px;}
.lvl i.on{background:var(--accent-2);border-color:var(--accent-2);}

.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}
.mode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow-s);display:flex;flex-direction:column;gap:6px;min-height:118px;transition:transform .15s,border-color .15s;}
.mode:hover{transform:translateY(-2px);border-color:var(--accent);}
.mode b{font-size:17.5px;}
.mode span{font-size:14.5px;color:var(--ink-2);line-height:1.45;}
.mode .tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-2);}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;}
.stat{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r-s);padding:12px 14px;}
.stat b{display:block;font-family:var(--f-mono);font-size:24px;font-weight:600;line-height:1.15;}
.stat span{font-size:12.5px;color:var(--ink-3);}

/* ---------- Aufgabenkarte ---------- */
.task-head{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;padding-bottom:12px;margin-bottom:16px;border-bottom:1px solid var(--line-soft);}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--accent-wash);color:var(--accent-2);white-space:nowrap;}
.chip.mute{background:var(--surface-2);color:var(--ink-3);white-space:normal;}
.chip.lv{margin-left:auto;display:inline-flex;align-items:center;gap:7px;background:var(--surface-2);color:var(--ink-2);}
.q{font-size:17px;line-height:1.7;}
.q p+p,.q p+.tblwrap,.q .tblwrap+p,.q .given+p,.q p+.given{margin-top:10px;}
.given{background:var(--surface-2);border:1px solid var(--line-soft);border-left:3px solid var(--accent);border-radius:var(--r-s);padding:12px 15px;margin:12px 0;}
.eqlist{display:flex;flex-wrap:wrap;gap:8px 26px;font-size:17.5px;}
.kbd{font-family:var(--f-mono);font-size:.88em;background:var(--surface-3);border:1px solid var(--line);border-radius:5px;padding:1px 6px;white-space:nowrap;}
.hintline{font-size:13.5px;color:var(--ink-3);margin-top:10px;}
.tabblock{margin-top:14px;padding:12px 14px;border:1px solid var(--line-soft);border-radius:var(--r-s);background:rgba(27,46,56,.45);}
.tabblock .tblwrap{margin-top:6px;}
.tabname{font-weight:700;font-size:15px;color:var(--ink-2);}

/* ---------- Eingaben ---------- */
.fields{display:flex;flex-wrap:wrap;gap:12px 22px;margin-top:16px;align-items:center;}
.fld{display:flex;align-items:center;gap:9px;font-size:16.5px;flex-wrap:nowrap;}
.fld-l{color:var(--ink-2);}
.fld-u{color:var(--ink-2);font-size:15px;white-space:nowrap;}
.in{font-family:var(--f-mono);font-size:17px;font-weight:500;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:9px 10px;min-height:46px;width:116px;text-align:center;}
.in.narrow{width:92px;}
.in.tiny{width:58px;min-height:36px;padding:4px 4px;font-size:15px;}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-wash);}
.in.good{border-color:var(--ok);background:var(--ok-wash);}
.in.bad{border-color:var(--bad);background:var(--bad-wash);}
select.in.sel{width:auto;min-width:98px;font-family:var(--f-math);font-style:italic;font-size:18px;text-align:left;}
.segwrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;}
.segc{display:inline-flex;flex-wrap:wrap;gap:6px;}
.segb{background:var(--surface-2);border:1.5px solid var(--line);border-radius:99px;padding:8px 15px;min-height:44px;font-size:15px;font-weight:600;color:var(--ink-2);}
.segb:hover{border-color:var(--accent);}
.segb.on{background:var(--accent-wash);border-color:var(--accent);color:var(--accent-2);}
.segc.good .segb.on{background:var(--ok-wash);border-color:var(--ok);color:var(--ok);}
.segc.bad .segb.on{background:var(--bad-wash);border-color:var(--bad);color:var(--bad);}
.ansatz{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:14px;font-size:19px;}
.ansatz .anl{font-size:13px;font-weight:600;color:var(--ink-3);min-width:96px;font-family:var(--f-ui);}
.supin{position:relative;top:-.85em;font-size:.85em;margin-left:2px;}
.when{animation:fade .25s ease both;}

.opts{display:flex;flex-direction:column;gap:9px;margin-top:16px;}
.opts.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
.opt{display:flex;align-items:flex-start;gap:11px;text-align:left;width:100%;background:var(--surface-2);border:1.5px solid var(--line);border-radius:var(--r-s);padding:13px 15px;min-height:48px;font-size:16px;line-height:1.6;transition:border-color .12s,background .12s;}
.opt:hover{border-color:var(--accent);}
.opt .k{font-family:var(--f-mono);font-weight:600;color:var(--ink-3);flex:0 0 auto;}
.opt.sel{border-color:var(--accent);background:var(--accent-wash);}
.opt.good{border-color:var(--ok);background:var(--ok-wash);}
.opt.bad{border-color:var(--bad);background:var(--bad-wash);}
.opt[disabled]{cursor:default;}
.optfig{display:block;width:100%;}
.optfig svg.plot{max-width:180px !important;}

/* ---------- Tabellen ---------- */
.tblwrap{overflow-x:auto;margin-top:12px;padding-bottom:4px;-webkit-overflow-scrolling:touch;}
table.vt{border-collapse:collapse;font-size:16px;}
table.vt th,table.vt td{border:1px solid var(--line);padding:7px 10px;text-align:center;min-width:62px;white-space:nowrap;}
table.vt th{background:var(--surface-2);font-weight:600;text-align:left;}
table.vt.vcol td:first-child{font-family:var(--f-mono);font-size:15px;}
table.vt td .in{min-height:40px;}

/* ---------- Abbildungen ---------- */
figure.fig{margin:16px 0 0;}
.plotbox{position:relative;border:1px solid var(--line);border-radius:var(--r-s);background:var(--plot-bg);padding:8px;overflow-x:auto;}
svg.plot{display:block;width:100%;height:auto;margin:0 auto;}
svg.dragplot{touch-action:none;-webkit-user-select:none;user-select:none;}
figcaption{font-size:13px;color:var(--ink-3);margin-top:7px;font-style:italic;text-align:center;}
figcaption b{font-style:normal;color:var(--ink-2);}
.pl-bg{fill:var(--plot-bg);}
.pl-grid{stroke:var(--grid);stroke-width:1;}
.pl-ax{stroke:var(--grid-strong);stroke-width:1.7;}
.ax-head{fill:var(--grid-strong);}
.pl-num{fill:var(--ink-3);font-family:var(--f-mono);}
.pl-lab{fill:var(--ink-2);font-family:var(--f-ui);font-size:13px;paint-order:stroke;stroke:var(--plot-bg);stroke-width:4px;stroke-linejoin:round;}
.pl-tri{font-family:var(--f-math);font-size:14px;font-weight:600;paint-order:stroke;stroke:var(--plot-bg);stroke-width:4px;stroke-linejoin:round;}
.pl-pt{font-family:var(--f-mono);font-size:13.5px;font-weight:700;paint-order:stroke;stroke:var(--plot-bg);stroke-width:4.5px;stroke-linejoin:round;}
.pl-tag{fill:var(--plot-bg);stroke-width:2;}
.pl-tagt{font-family:var(--f-mono);font-size:12.5px;font-weight:700;}
.h-touch{fill:rgba(224,172,78,.08);stroke:none;}
.h-dot{fill:var(--c2);stroke:var(--plot-bg);stroke-width:2.5;}
.h-lab{fill:var(--c2);font-family:var(--f-mono);font-size:12px;font-weight:700;}
.handle.drag .h-touch{fill:rgba(224,172,78,.22);}

/* ---------- Aktionen und Rückmeldung ---------- */
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;align-items:center;}
.btn{background:var(--accent);color:var(--accent-ink);border:1.5px solid var(--accent);border-radius:99px;padding:11px 22px;min-height:48px;font-weight:600;font-size:15.5px;transition:background .14s,transform .1s;}
.btn:hover{background:var(--accent-2);border-color:var(--accent-2);}
.btn:active{transform:translateY(1px);}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line);}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink);border-color:var(--accent);}
.btn.quiet{background:transparent;color:var(--ink-3);border-color:transparent;padding:11px 14px;}
.btn.quiet:hover{color:var(--bad);background:var(--bad-wash);}
.btn.on-plate{background:#3ED8E8;border-color:#3ED8E8;color:#062026;}
.btn.ghost.on-plate{background:rgba(255,255,255,.04);color:#EAF4F6;border-color:rgba(143,179,188,.4);}
.filmbtn{background:linear-gradient(180deg,var(--accent),var(--accent-2));border:1.5px solid var(--accent-2);color:var(--accent-ink);border-radius:99px;padding:11px 20px 11px 15px;min-height:48px;font-weight:600;font-size:15.5px;display:inline-flex;align-items:center;gap:9px;}
.filmbtn svg{width:19px;height:19px;flex:0 0 19px;}
.spacer{margin-left:auto;}
.counter{font-family:var(--f-mono);font-size:13px;color:var(--ink-3);letter-spacing:.04em;}
.fb{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r-s);padding:14px 16px;margin-top:18px;border:1px solid;font-size:16px;line-height:1.6;}
.fb .ic{flex:0 0 26px;margin-top:1px;}
.fb .ic svg{display:block;width:26px;height:26px;}
.fb.ok{background:var(--ok-wash);border-color:var(--ok);}
.fb.part{background:var(--warn-wash);border-color:var(--warn);}
.fb.bad{background:var(--bad-wash);border-color:var(--bad);}
.hintbox{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:var(--r-s);padding:12px 15px;margin-top:12px;line-height:1.7;}
.hintbox .hl{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--warn);display:block;margin-bottom:3px;}
.sol{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r-s);padding:14px 16px;margin-top:14px;}
.sol h4{font-size:15px;margin-bottom:8px;}
.sol ol{margin:0;padding-left:20px;}
.sol li{margin-bottom:6px;line-height:1.75;}
.tickpath{stroke-dasharray:34;stroke-dashoffset:34;animation:draw .5s .05s ease forwards;}
.crosspath{stroke-dasharray:22;stroke-dashoffset:22;animation:draw .4s .05s ease forwards;}
@keyframes draw{to{stroke-dashoffset:0;}}
.shake{animation:shake .38s cubic-bezier(.36,.07,.19,.97) both;}
@keyframes shake{10%,90%{transform:translateX(-1.5px);}20%,80%{transform:translateX(3px);}30%,50%,70%{transform:translateX(-5px);}40%,60%{transform:translateX(5px);}}
.streak{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;color:var(--warn);background:var(--warn-wash);border-radius:99px;padding:3px 10px;}

/* ---------- Prüfungsbogen ---------- */
.exambar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.dots{display:flex;gap:5px;flex-wrap:wrap;}
.dot{width:14px;height:14px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface-2);}
.dot.done{background:var(--ink-3);border-color:var(--ink-3);}
.dot.now{background:var(--accent);border-color:var(--accent);transform:scale(1.15);}

<script>
"use strict";
/* ============================================================
   Funktionenführerschein: Kern
   Zufall, Zahlen, Notation, Abbildungen, Eingaben, Auswertung.
   Läuft im Browser und in Node (pruefe.js), greift nicht auf das DOM zu.
   ============================================================ */
var MINUS = '−', THIN = ' ';

/* ---------- Zufall ---------- */
function rnd(n){ return Math.floor(Math.random()*n); }
function ri(a,b){ return a + rnd(b-a+1); }
function pick(a){ return a[rnd(a.length)]; }
function shuffle(a){
  var b = a.slice(), i, j, t;
  for(i=b.length-1;i>0;i--){ j = rnd(i+1); t = b[i]; b[i] = b[j]; b[j] = t; }
  return b;
}
function pickN(a,k){ return shuffle(a).slice(0,k); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ var t=a%b; a=b; b=t; } return a; }

/* ---------- Runden und Vergleichen ---------- */
function rd(x,d){
  var f = Math.pow(10,d), y = Number((Math.abs(x)*f).toFixed(6));
  var r = Math.round(y)/f;
  return x<0 ? -r : r;
}
function near(a,b,t){ return Math.abs(a-b) <= (t===undefined ? 1e-9 : t) + 1e-9; }
/* Bruchdarstellung einer Kommazahl mit kleinem Nenner, sonst null */
function fracOf(x, maxd){
  var d;
  maxd = maxd || 12;
  for(d=1; d<=maxd; d++){
    var n = Math.round(x*d);
    if(Math.abs(n - x*d) < 1e-7){ return {n:n, d:d}; }
  }
  return null;
}
/* bricht die Dezimalentwicklung nach höchstens k Stellen ab? */
function terminates(x,k){ return Math.abs(rd(x,k)-x) < 1e-9; }
/* Toleranz für Eingaben: exakt, wenn die Zahl abbricht, sonst zwei Nachkommastellen */
function tolFor(x){ return terminates(x,3) ? 0 : 0.0051; }

/* ---------- Zahlen im deutschen Format ---------- */
function nf(x, d){
  if(d===undefined) d = 6;
  var y = rd(x,d);
  if(y===0) y = 0;
  var s = Math.abs(y).toFixed(d);
  if(s.indexOf('.')>=0) s = s.replace(/0+$/,'').replace(/\.$/,'');
  var p = s.split('.');
  if(p[0].length>4) p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, THIN);
  s = p.join(',');
  return (y<0 ? MINUS : '') + s;
}
/* feste Nachkommastellen, z. B. Messwerte 2,0 */
function nfix(x, d){
  var s = Math.abs(rd(x,d)).toFixed(d).replace('.',',');
  return (rd(x,d)<0 ? MINUS : '') + s;
}
/* Zahl für Lösungsschlüssel und Eingaben */
function ansStr(x){
  if(terminates(x,4)) return nf(x,4).replace(MINUS,'-').replace(/ /g,'');
  var f = fracOf(x,60);
  if(f) return f.n+'/'+f.d;
  return String(rd(x,4)).replace('.',',');
}
function par(x){ return x<0 ? '('+nf(x)+')' : nf(x); }

/* ---------- Notation ---------- */
function mv(v){ return '<i class="mv">'+v+'</i>'; }
function mfrac(a,b){ return '<span class="mfrac"><span class="mf-n">'+a+'</span><span class="mf-d">'+b+'</span></span>'; }
function msup(b,e){ return '<span class="mterm">'+b+'<sup class="mexp">'+e+'</sup></span>'; }
function sub(v,i){ return mv(v)+'<sub>'+i+'</sub>'; }
function U(u){ return THIN+'<span class="unit">'+u+'</span>'; }
function q(x,u,d){ return nf(x,d)+U(u); }
function fx(name,arg){ return mv(name)+'('+(arg===undefined ? mv('x') : arg)+')'; }
function DY(){ return 'Δ'+mv('y'); }
function DX(){ return 'Δ'+mv('x'); }
function D(v){ return 'Δ'+mv(v); }
/* Zahl als Bruch (gestapelt) oder Dezimalzahl */
function vH(x, mode){
  var f = fracOf(x,12);
  if(f && f.d===1) return nf(x);
  if(mode==='dec' && terminates(x,3)) return nf(x);
  if(f && (mode==='frac' || !terminates(x,3))) return (f.n<0 ? MINUS : '') + mfrac(String(Math.abs(f.n)), String(f.d));
  return nf(x);
}
function ptH(name,x,y,mode){ return name+'('+vH(x,mode||'dec')+' | '+vH(y,mode||'dec')+')'; }
/* Koeffizient vor x */
function coefH(m, mode){
  if(m===1) return '';
  if(m===-1) return MINUS;
  return vH(m, mode) + (fracOf(m,12) && fracOf(m,12).d>1 && mode!=='dec' ? THIN : '');
}
/* f(x) = m x + b */
function linH(m, b, name, mode, var_){
  var v = var_ || 'x', s = '';
  if(m!==0) s = coefH(m, mode) + mv(v);
  if(s===''){ s = vH(b, mode); }
  else if(b!==0){ s += (b<0 ? ' '+MINUS+' ' : ' + ') + vH(Math.abs(b), mode); }
  return (name ? fx(name, mv(v)) : mv('y')) + ' = ' + s;
}
/* a · b^x */
function expH(a, b, name, v){
  return (name ? fx(name, mv(v||'x')) + ' = ' : '') + (a===1 ? '' : vH(a) + ' &middot; ') + msup((fracOf(b,12) && fracOf(b,12).d>1 && !terminates(b,3) ? '('+vH(b)+')' : vH(b)), mv(v||'x'));
}
/* a · x^n */
function potH(a, n, name, v){
  var e = (n<0 ? MINUS : '') + nf(Math.abs(n));
  return (name ? fx(name, mv(v||'x')) + ' = ' : '') + (a===1 ? '' : nf(a) + ' &middot; ') + msup(mv(v||'x'), e);
}
function kbd(t){ return '<span class="kbd">'+t+'</span>'; }

/* ---------- Eingabeelemente ---------- */
function inp(k, cls){
  return '<input class="in'+(cls ? ' '+cls : '')+'" data-k="'+k+'" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="'+k+'">';
}
function fld(label, k, unit, cls){
  return '<label class="fld"><span class="fld-l">'+label+'</span>'+inp(k, cls)+(unit ? '<span class="fld-u">'+unit+'</span>' : '')+'</label>';
}
function fields(){ return '<div class="fields">'+Array.prototype.join.call(arguments,'')+'</div>'; }
/* Auswahl über große Knöpfe */
function segc(k, opts, label){
  var s = '<div class="segwrap">'+(label ? '<span class="fld-l">'+label+'</span>' : '')+'<div class="segc" data-segk="'+k+'">', i;
  for(i=0;i<opts.length;i++) s += '<button type="button" class="segb" data-act="seg" data-k="'+k+'" data-v="'+opts[i][0]+'">'+opts[i][1]+'</button>';
  return s + '</div><input type="hidden" data-k="'+k+'" value=""></div>';
}
function when(k, v, html){ return '<div class="when" data-when="'+k+':'+v+'" style="display:none">'+html+'</div>'; }
function selc(k, opts, label){
  var s = '<label class="fld">'+(label ? '<span class="fld-l">'+label+'</span>' : '')+'<select class="in sel" data-k="'+k+'"><option value="">wählen</option>', i;
  for(i=0;i<opts.length;i++) s += '<option value="'+opts[i][0]+'">'+opts[i][1]+'</option>';
  return s + '</select></label>';
}
/* Wertetabelle: kopf = Liste, zeilen = [[Kopfzelle, Werte ...], ...] */
function tbl(rows){
  var s = '<div class="tblwrap"><table class="vt">', i, j;
  for(i=0;i<rows.length;i++){
    s += '<tr>';
    for(j=0;j<rows[i].length;j++) s += (j===0 ? '<th>' : '<td>') + rows[i][j] + (j===0 ? '</th>' : '</td>');
    s += '</tr>';
  }
  return s + '</table></div>';
}

/* ---------- Eingaben lesen ---------- */
function parseNum(s){
  if(s===undefined || s===null) return null;
  s = String(s).replace(/[\s  ]+/g,'').replace(/[−–—]/g,'-').replace(/,/g,'.');
  s = s.replace(/(km\/h|m\/s²|m\/s2|m\/s|[a-zA-Zäöü°%²³]+(\/[a-zA-Zäöü²³]+)?)$/,'');
  if(s==='') return null;
  var m = s.match(/^([+-]?)(\d+(?:\.\d*)?|\.\d+)(?:\/([+-]?)(\d+(?:\.\d*)?|\.\d+))?$/);
  if(!m) return null;
  var v = parseFloat(m[2]);
  if(m[4]!==undefined){
    var den = parseFloat(m[4]);
    if(den===0) return null;
    v = v/den;
    if(m[3]==='-') v = -v;
  }
  if(m[1]==='-') v = -v;
  return v;
}

/* ---------- Auswertung ----------
   spec: {k, x: Sollwert, tol, d: [[Wert, Meldung], ...], miss: Meldung}
   oder  {k, c: Sollwahl, d: {Wahl: Meldung}, miss: Meldung} */
function chk(v, specs, okMsg){
  var marks = {}, n = specs.length, ok = 0, filled = 0, msgs = [], i, s, raw, g, good, dm, j;
  for(i=0;i<n;i++){
    s = specs[i];
    raw = v[s.k];
    if(raw===undefined || String(raw).trim()===''){ marks[s.k] = 'bad'; continue; }
    filled++;
    dm = '';
    if(s.c!==undefined){
      good = (String(raw)===String(s.c));
      if(!good && s.d && s.d[raw]) dm = s.d[raw];
    } else {
      g = parseNum(raw);
      good = (g!==null) && near(g, s.x, s.tol||0);
      if(!good && g===null) dm = 'Bei '+(s.lab||'einer Angabe')+' steht keine Zahl. Schreibe zum Beispiel '+kbd('2,5')+' oder '+kbd('-3')+'.';
      if(!good && g!==null && s.d){
        for(j=0;j<s.d.length;j++){
          if(s.d[j][0]!==null && near(g, s.d[j][0], Math.max(s.tol||0, 1e-6))){ dm = s.d[j][1]; break; }
        }
      }
    }
    if(good){ ok++; marks[s.k] = 'good'; }
    else {
      marks[s.k] = 'bad';
      if(!dm) dm = s.miss || '';
      if(dm && msgs.indexOf(dm)<0) msgs.push(dm);
    }
  }
  if(filled===0) return {status:'wrong', nosel:true, msg:'Trage zuerst deine Antwort ein.', marks:{}};
  if(ok===n) return {status:'correct', msg: okMsg || 'Alles richtig.', marks:marks};
  if(filled<n) msgs.push(n-filled===1 ? 'Eine Angabe fehlt noch.' : 'Es fehlen noch '+(n-filled)+' Angaben.');
  if(msgs.length===0) msgs.push('Rechne die rot markierten Angaben noch einmal nach.');
  var head = n>1 ? '<b>'+ok+' von '+n+'</b> Angaben stimmen. ' : '';
  return {status: ok>0 ? 'partial' : 'wrong', msg: head + msgs.join(' '), marks:marks};
}

/* ---------- Abbildungen ----------
   c: xmin,xmax,ymin,ymax, gx,gy (Gitterweite), lx,ly (Beschriftung), cell (px je Kästchen),
      xlab,ylab, lines[{m,b,col,w,dash,lab}], curves[{f,col,w,dash,dom}], segs[{x1,y1,x2,y2,col,w,dash}],
      tris[{x1,y1,x2,y2,col,tx,ty}], pts[{x,y,lab,col,big}], drag{init:[[x,y],[x,y]]}, small, alt */
var PLOT_ID = 0;
function plot(c){
  var gx = c.gx||1, gy = c.gy||1, lx = c.lx||gx, ly = c.ly||gy;
  var nx = Math.round((c.xmax-c.xmin)/gx), ny = Math.round((c.ymax-c.ymin)/gy);
  var cell = c.cell || Math.max(17, Math.min(30, Math.floor(400/Math.max(nx,ny))));
  var PL = c.padL!==undefined ? c.padL : 30, PR = 22, PT = 22, PB = c.padB!==undefined ? c.padB : 26;
  var W = Math.round(nx*cell + PL + PR), H = Math.round(ny*cell + PT + PB);
  var id = 'p'+(++PLOT_ID)+'x'+rnd(100000);
  function X(x){ return PL + (x-c.xmin)/gx*cell; }
  function Y(y){ return PT + (c.ymax-y)/gy*cell; }
  function f1(v){ return v.toFixed(1); }
  var s = '', i, k, x, y;
  var fs = c.small ? 11 : 12.5;
  s += '<svg class="plot'+(c.drag ? ' dragplot' : '')+'" viewBox="0 0 '+W+' '+H+'" style="max-width:'+W+'px" role="img" aria-label="'+esc(c.alt||'Koordinatensystem')+'"'
     + (c.drag ? ' data-map="'+[PL,PT,cell,gx,gy,c.xmin,c.ymax,c.xmax,c.ymin].join(',')+'"' : '') + '>';
  s += '<defs><clipPath id="'+id+'c"><rect x="'+PL+'" y="'+PT+'" width="'+(nx*cell)+'" height="'+(ny*cell)+'"/></clipPath>'
     + '<marker id="'+id+'a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 z" class="ax-head"/></marker></defs>';
  s += '<rect x="'+PL+'" y="'+PT+'" width="'+(nx*cell)+'" height="'+(ny*cell)+'" class="pl-bg"/>';
  for(i=0;i<=nx;i++) s += '<line x1="'+f1(PL+i*cell)+'" y1="'+PT+'" x2="'+f1(PL+i*cell)+'" y2="'+(PT+ny*cell)+'" class="pl-grid"/>';
  for(i=0;i<=ny;i++) s += '<line x1="'+PL+'" y1="'+f1(PT+i*cell)+'" x2="'+(PL+nx*cell)+'" y2="'+f1(PT+i*cell)+'" class="pl-grid"/>';
  var ax = (c.xmin<=0 && c.xmax>=0) ? X(0) : X(c.xmin);
  var ay = (c.ymin<=0 && c.ymax>=0) ? Y(0) : Y(c.ymin);
  s += '<line x1="'+PL+'" y1="'+f1(ay)+'" x2="'+(W-6)+'" y2="'+f1(ay)+'" class="pl-ax" marker-end="url(#'+id+'a)"/>';
  s += '<line x1="'+f1(ax)+'" y1="'+(PT+ny*cell)+'" x2="'+f1(ax)+'" y2="6" class="pl-ax" marker-end="url(#'+id+'a)"/>';
  /* Skalenzahlen */
  var xa0 = (c.xmin<=0 && c.xmax>=0), ya0 = (c.ymin<=0 && c.ymax>=0);
  for(k=Math.ceil(c.xmin/lx-1e-9); k*lx<=c.xmax+1e-9; k++){
    x = k*lx;
    if(Math.abs(x)<1e-9 && (xa0 && ya0)) continue;
    if(Math.abs(x-c.xmax)<1e-9 && !c.lastX) continue;
    s += '<text x="'+f1(X(x))+'" y="'+f1(ay+16)+'" text-anchor="middle" class="pl-num" style="font-size:'+fs+'px">'+nf(x)+'</text>';
    s += '<line x1="'+f1(X(x))+'" y1="'+f1(ay-3)+'" x2="'+f1(X(x))+'" y2="'+f1(ay+3)+'" class="pl-ax"/>';
  }
  for(k=Math.ceil(c.ymin/ly-1e-9); k*ly<=c.ymax+1e-9; k++){
    y = k*ly;
    if(Math.abs(y)<1e-9 && (xa0 && ya0)) continue;
    if(Math.abs(y-c.ymax)<1e-9 && !c.lastY) continue;
    s += '<text x="'+f1(ax-6)+'" y="'+f1(Y(y)+4)+'" text-anchor="end" class="pl-num" style="font-size:'+fs+'px">'+nf(y)+'</text>';
    s += '<line x1="'+f1(ax-3)+'" y1="'+f1(Y(y))+'" x2="'+f1(ax+3)+'" y2="'+f1(Y(y))+'" class="pl-ax"/>';
  }
  if(xa0 && ya0) s += '<text x="'+f1(ax-6)+'" y="'+f1(ay+15)+'" text-anchor="end" class="pl-num" style="font-size:'+fs+'px">0</text>';
  s += '<text x="'+(W-8)+'" y="'+f1(ay-8)+'" text-anchor="end" class="pl-lab">'+(c.xlab||'<tspan font-style="italic">x</tspan>')+'</text>';
  s += '<text x="'+f1(ax+9)+'" y="15" class="pl-lab">'+(c.ylab||'<tspan font-style="italic">y</tspan>')+'</text>';

  s += '<g clip-path="url(#'+id+'c)">';
  var segs = c.segs || [];
  for(i=0;i<segs.length;i++){
    var G = segs[i];
    s += '<line x1="'+f1(X(G.x1))+'" y1="'+f1(Y(G.y1))+'" x2="'+f1(X(G.x2))+'" y2="'+f1(Y(G.y2))+'" style="stroke:'+(G.col||'var(--c2)')+';stroke-width:'+(G.w||2.4)+(G.dash ? ';stroke-dasharray:6 5' : '')+';stroke-linecap:round"/>';
  }
  var curves = c.curves || [];
  for(i=0;i<curves.length;i++){
    var C = curves[i], a0 = C.dom ? Math.max(C.dom[0],c.xmin) : c.xmin, a1 = C.dom ? Math.min(C.dom[1],c.xmax) : c.xmax, pts = [], N = 260;
    for(k=0;k<=N;k++){
      x = a0 + (a1-a0)*k/N; y = C.f(x);
      if(isFinite(y) && y>c.ymin-(c.ymax-c.ymin) && y<c.ymax+(c.ymax-c.ymin)) pts.push(f1(X(x))+','+f1(Y(y)));
    }
    s += '<polyline points="'+pts.join(' ')+'" style="fill:none;stroke:'+(C.col||'var(--c1)')+';stroke-width:'+(C.w||2.8)+(C.dash ? ';stroke-dasharray:7 6' : '')+';stroke-linejoin:round;stroke-linecap:round"/>';
  }
  var lines = c.lines || [];
  for(i=0;i<lines.length;i++){
    var L = lines[i];
    s += '<line x1="'+f1(X(c.xmin-gx))+'" y1="'+f1(Y(L.m*(c.xmin-gx)+L.b))+'" x2="'+f1(X(c.xmax+gx))+'" y2="'+f1(Y(L.m*(c.xmax+gx)+L.b))+'" style="stroke:'+(L.col||'var(--c1)')+';stroke-width:'+(L.w||2.8)+(L.dash ? ';stroke-dasharray:8 6' : '')+';stroke-linecap:round"/>';
  }
  var tris = c.tris || [];
  for(i=0;i<tris.length;i++){
    var T = tris[i], tc = T.col || 'var(--c2)';
    s += '<path d="M'+f1(X(T.x1))+' '+f1(Y(T.y1))+' L'+f1(X(T.x2))+' '+f1(Y(T.y1))+' L'+f1(X(T.x2))+' '+f1(Y(T.y2))+'" style="fill:none;stroke:'+tc+';stroke-width:2.2;stroke-dasharray:6 4"/>';
  }
  if(c.drag) s += '<line class="dragline" x1="0" y1="0" x2="0" y2="0" style="stroke:var(--c1);stroke-width:3;stroke-linecap:round;display:none"/>';
  s += '</g>';
  /* Beschriftungen außerhalb des Ausschnitts zeichnen dürfen */
  for(i=0;i<tris.length;i++){
    var T2 = tris[i], tc2 = T2.col || 'var(--c2)', below = (T2.y2>T2.y1);
    if(T2.tx) s += '<text x="'+f1((X(T2.x1)+X(T2.x2))/2)+'" y="'+f1(Y(T2.y1)+(below ? 17 : -7))+'" text-anchor="middle" class="pl-tri" style="fill:'+tc2+'">'+T2.tx+'</text>';
    if(T2.ty) s += '<text x="'+f1(X(T2.x2)+(T2.x2>T2.x1 ? 7 : -7))+'" y="'+f1((Y(T2.y1)+Y(T2.y2))/2+4)+'" text-anchor="'+(T2.x2>T2.x1 ? 'start' : 'end')+'" class="pl-tri" style="fill:'+tc2+'">'+T2.ty+'</text>';
  }
  for(i=0;i<lines.length;i++){
    var L2 = lines[i];
    if(L2.lab){
      var lp = labelSpot(L2, lines, c);
      if(lp){
        s += '<circle cx="'+f1(X(lp[0]))+'" cy="'+f1(Y(lp[1]))+'" r="11" class="pl-tag" style="stroke:'+(L2.col||'var(--c1)')+'"/>';
        s += '<text x="'+f1(X(lp[0]))+'" y="'+f1(Y(lp[1])+4.5)+'" text-anchor="middle" class="pl-tagt" style="fill:'+(L2.col||'var(--c1)')+'">'+L2.lab+'</text>';
      }
    }
  }
  var P = c.pts || [];
  for(i=0;i<P.length;i++){
    var p = P[i], pc = p.col || 'var(--c2)';
    if(p.x<c.xmin-1e-9 || p.x>c.xmax+1e-9 || p.y<c.ymin-1e-9 || p.y>c.ymax+1e-9) continue;
    s += '<circle cx="'+f1(X(p.x))+'" cy="'+f1(Y(p.y))+'" r="'+(p.big ? 6.5 : 5)+'" style="fill:'+pc+';stroke:var(--plot-bg);stroke-width:2"/>';
    if(p.lab){
      var right = X(p.x) < PL + nx*cell*0.62;
      var up = p.up!==undefined ? p.up : (Y(p.y) > PT + 26);
      s += '<text x="'+f1(X(p.x)+(right ? 9 : -9))+'" y="'+f1(Y(p.y)+(up ? -9 : 19))+'" text-anchor="'+(right ? 'start' : 'end')+'" class="pl-pt" style="fill:'+pc+'">'+p.lab+'</text>';
    }
  }
  if(c.drag){
    for(i=0;i<2;i++){
      var h = c.drag.init[i];
      s += '<g class="handle" data-h="'+i+'" data-x="'+h[0]+'" data-y="'+h[1]+'" transform="translate('+f1(X(h[0]))+','+f1(Y(h[1]))+')">'
         + '<circle r="20" class="h-touch"/><circle r="8" class="h-dot"/><text y="-13" text-anchor="middle" class="h-lab">'+(i===0 ? 'A' : 'B')+'</text></g>';
    }
  }
  s += '</svg>';
  return s;
}
/* freie Stelle für die Nummer eines Graphen */
function labelSpot(L, all, c){
  var best = null, bs = -1, k, j, x, y, sc, d;
  var gx = c.gx||1, gy = c.gy||1;
  for(k=1;k<40;k++){
    x = c.xmin + (c.xmax-c.xmin)*k/40;
    y = L.m*x + L.b;
    if(y<c.ymin+0.9*gy || y>c.ymax-0.9*gy || x<c.xmin+0.9*gx || x>c.xmax-0.9*gx) continue;
    sc = 99;
    for(j=0;j<all.length;j++){
      if(all[j]===L) continue;
      d = Math.abs((all[j].m*x + all[j].b) - y)/gy / Math.sqrt(1+Math.pow(all[j].m*gx/gy,2));
      if(d<sc) sc = d;
      if(all[j].lp){ var dd = Math.sqrt(Math.pow((all[j].lp[0]-x)/gx,2)+Math.pow((all[j].lp[1]-y)/gy,2)); if(dd<sc) sc = dd; }
    }
    if(Math.abs(x)<0.6*gx || Math.abs(y)<0.6*gy) sc -= 0.7;
    if(sc>bs){ bs = sc; best = [x,y]; }
  }
  L.lp = best;
  return best;
}
function figure(svg, cap){
  return '<figure class="fig"><div class="plotbox">'+svg+'</div>'+(cap ? '<figcaption>'+cap+'</figcaption>' : '')+'</figure>';
}

/* ---------- Aufgaben-Hülle ---------- */
function mkTask(o){
  if(!o.hints) o.hints = [];
  if(!o.sol) o.sol = '';
  if(o.specs && !o.check){
    var sp = o.specs, okm = o.okMsg;
    o.check = function(v){ return chk(v, sp, okm); };
  }
  return o;
}
/* Mehrfachauswahl: Liste von {h, ok, why} mischen, Lösungsindex merken */
function mcTask(o, opts){
  var sh = shuffle(opts), i;
  o.opts = sh;
  for(i=0;i<sh.length;i++) if(sh[i].ok) o.ans = {opt:i};
  return mkTask(o);
}
function ol(items){ return '<ol><li>'+items.join('</li><li>')+'</li></ol>'; }

/* ============================================================
   Bereich A: Steigung und Geraden (S1 bis S6)
   ============================================================ */
function svgDX(){ return 'Δ<tspan font-style="italic">x</tspan>'; }
function svgDY(){ return 'Δ<tspan font-style="italic">y</tspan>'; }
function winFor(xs, ys, pad, minSpan){
  var a = Math.min.apply(null, xs.concat([0])), b = Math.max.apply(null, xs.concat([0]));
  var c = Math.min.apply(null, ys.concat([0])), d = Math.max.apply(null, ys.concat([0]));
  a = Math.floor(a)-pad; b = Math.ceil(b)+pad; c = Math.floor(c)-pad; d = Math.ceil(d)+pad;
  while(b-a<minSpan){ b++; if(b-a<minSpan) a--; }
  while(d-c<minSpan){ d++; if(d-c<minSpan) c--; }
  return {xmin:a, xmax:b, ymin:c, ymax:d};
}
function triFig(x1,y1,x2,y2,extra){
  var w = winFor([x1,x2],[y1,y2],1,8);
  if(w.xmax-w.xmin>18 || w.ymax-w.ymin>18) return '';
  var m = (y2-y1)/(x2-x1), b = y1 - m*x1;
  var c = {xmin:w.xmin, xmax:w.xmax, ymin:w.ymin, ymax:w.ymax,
    lines:[{m:m, b:b, col:'var(--c1)'}],
    tris:[{x1:x1,y1:y1,x2:x2,y2:y2, tx:svgDX()+' = '+nf(x2-x1), ty:svgDY()+' = '+nf(y2-y1)}],
    pts:[{x:x1,y:y1,lab:'P'},{x:x2,y:y2,lab:'Q'}]};
  if(extra) extra(c);
  return figure(plot(c), '<b>Abb.:</b> Steigungsdreieck von P nach Q');
}
function mDiag(m, dy, dx){
  var d = [];
  if(m!==0 && !near(1/m, m)) d.push([dx/dy, 'Du hast '+DX()+' und '+DY()+' vertauscht. Oben steht die Änderung von '+mv('y')+', unten die von '+mv('x')+'.']);
  d.push([-m, 'Das Vorzeichen stimmt nicht. Rechne oben und unten in derselben Reihenfolge: zweimal „Q minus P“.']);
  if(!near(dy,m)) d.push([dy, 'Das ist '+DY()+'. Teile noch durch '+DX()+'.']);
  return d;
}

/* ---------- S1 Steigung aus zwei Punkten ---------- */
function genS1(L){
  var x1, x2, y1, y2, m, p, qq, k, dx;
  if(L===1){
    m = pick([1,2,3,4,-1,-2,-3,0.5]);
    x1 = ri(0,4); dx = (m===0.5) ? pick([2,4]) : ri(1,4); x2 = x1+dx; y1 = ri(0,6); y2 = y1 + m*dx;
  } else if(L===2){
    qq = pick([1,2,2,3,4]);
    do{ p = ri(-6,6); } while(p===0 || gcd(p,qq)!==1 || (qq===1 && Math.abs(p)>5));
    m = p/qq;
    do{ x1 = ri(-6,6); k = pick([1,2,-1,-2]); x2 = x1 + k*qq; } while(x2<-8 || x2>8);
    y1 = ri(-6,6); y2 = y1 + m*(x2-x1);
  } else {
    if(rnd(2)===0){
      m = pick([0.5,1.5,2.5,-0.5,-1.5,-2.5,-0.75,1.25,0.4,-0.6,1.2,-2.4]);
      do{
        x1 = ri(-30,30)/10; dx = pick([0.5,1.5,2,2.5,3,4,5]) * pick([1,-1]); x2 = rd(x1+dx,2);
        y1 = ri(-40,40)/10; y2 = rd(y1 + m*dx, 6);
      } while(!terminates(y2,2) || x2===0);
    } else {
      qq = pick([3,6,7,9]);
      do{ p = ri(-8,8); } while(p===0 || gcd(p,qq)!==1);
      m = p/qq;
      x1 = ri(-20,20); x2 = x1 + qq*pick([1,2,3,-1,-2]); y1 = ri(-40,40); y2 = y1 + m*(x2-x1);
    }
  }
  var dy = y2-y1, dxx = x2-x1;
  var tol = tolFor(m);
  var body = '<p>Eine Gerade geht durch die Punkte '+ptH('P',x1,y1)+' und '+ptH('Q',x2,y2)+'.</p>'
    + '<p><b>Bestimme</b> die Steigung '+mv('m')+' der Geraden.</p>'
    + fields(fld(mv('m')+' =', 'm'))
    + (tol>0 ? '<p class="hintline">Gib einen Bruch an (z. B. '+kbd('-2/3')+') oder runde auf zwei Nachkommastellen.</p>' : '');
  var formel = mv('m') + ' = ' + mfrac(DY(), DX()) + ' = ' + mfrac(sub('y','Q')+' '+MINUS+' '+sub('y','P'), sub('x','Q')+' '+MINUS+' '+sub('x','P'));
  var einges = mfrac(nf(y2)+' '+MINUS+' '+par(y1), nf(x2)+' '+MINUS+' '+par(x1));
  return mkTask({
    type:'S1', level:L, op:'Bestimme', title:'Steigung aus zwei Punkten', body:body,
    hints:[
      'Die Steigung sagt, um wie viel sich '+mv('y')+' ändert, wenn '+mv('x')+' um 1 wächst: '+formel,
      'Setze ein. Nimm oben und unten dieselbe Reihenfolge: '+mv('m')+' = '+einges,
      DY()+' = '+nf(dy)+' und '+DX()+' = '+nf(dxx)+'. Jetzt nur noch teilen.'
    ],
    sol: ol([
      DY()+' = '+nf(y2)+' '+MINUS+' '+par(y1)+' = '+nf(dy),
      DX()+' = '+nf(x2)+' '+MINUS+' '+par(x1)+' = '+nf(dxx),
      mv('m')+' = '+mfrac(nf(dy), nf(dxx))+' = '+vH(m)+(tol>0 ? ' &asymp; '+nf(m,2) : ''),
      'Die Gerade '+(m>0 ? 'steigt, weil '+mv('m')+' &gt; 0 ist.' : 'fällt, weil '+mv('m')+' &lt; 0 ist.')
    ]),
    solFig: (L<3 ? triFig(x1,y1,x2,y2) : ''),
    specs:[{k:'m', x:m, tol:tol, lab:mv('m'), d:mDiag(m,dy,dxx), miss:'Prüfe noch einmal '+DY()+' und '+DX()+'.'}],
    okMsg:'Die Steigung ist '+mv('m')+' = '+vH(m)+'.',
    ans:{m:ansStr(m)}, data:{x1:x1,y1:y1,x2:x2,y2:y2},
    sig:'S1|'+[x1,y1,x2,y2].join(',')
  });
}

/* ---------- S2 Geradengleichung aus zwei Punkten ---------- */
function genS2(L){
  var m, b, x1, x2, y1, y2, p, qq, r, xs, i;
  if(L===1){
    m = pick([1,2,3,-1,-2,-3,4]); b = ri(-4,6);
    xs = pickN([0,1,2,3,4,5,6],2); x1 = xs[0]; x2 = xs[1];
  } else if(L===2){
    qq = pick([2,3,4,1]);
    do{ p = ri(-5,5); } while(p===0 || gcd(p,qq)!==1);
    m = p/qq; b = ri(-5,5);
    xs = []; for(i=-8;i<=8;i++) if(i%qq===0 && Math.abs(m*i+b)<=12) xs.push(i);
    xs = pickN(xs,2); x1 = xs[0]; x2 = xs[1];
  } else {
    qq = pick([2,3,2]);
    do{ p = ri(-5,5); } while(p===0 || gcd(p,qq)!==1);
    do{ r = ri(-9,9); } while(r%qq===0);
    m = p/qq; b = r/qq;
    xs = []; for(i=-9;i<=9;i++) if(Math.abs((p*i+r)%qq)===0 && Math.abs(m*i+b)<=14) xs.push(i);
    xs = pickN(xs,2); x1 = xs[0]; x2 = xs[1];
  }
  y1 = m*x1+b; y2 = m*x2+b;
  if(rnd(2)===0 && L>1){ var t = x1; x1 = x2; x2 = t; t = y1; y1 = y2; y2 = t; }
  var mode = L===1 ? 'dec' : 'frac';
  var tm = tolFor(m), tb = tolFor(b);
  var body = '<p>Eine Gerade geht durch '+ptH('P',x1,y1)+' und '+ptH('Q',x2,y2)+'.</p>'
    + '<p><b>Bestimme</b> ihre Funktionsgleichung '+mv('y')+' = '+mv('m')+mv('x')+' + '+mv('b')+'. <b>Gib an</b>, ob die Gerade steigt oder fällt.</p>'
    + fields(fld(mv('m')+' =','m'), fld(mv('b')+' =','b'))
    + segc('dir', [['s','steigt'],['f','fällt']], 'Die Gerade')
    + ((tm>0 || tb>0 || L>1) ? '<p class="hintline">Brüche kannst du mit Schrägstrich eingeben, z. B. '+kbd('5/2')+'.</p>' : '');
  var dy = y2-y1, dx = x2-x1;
  return mkTask({
    type:'S2', level:L, op:'Bestimme', title:'Geradengleichung aus zwei Punkten', body:body,
    hints:[
      'Zuerst die Steigung '+mv('m')+' = '+mfrac(DY(),DX())+' aus den beiden Punkten. Danach einen Punkt in '+mv('y')+' = '+mv('m')+mv('x')+' + '+mv('b')+' einsetzen.',
      mv('m')+' = '+mfrac(nf(y2)+' '+MINUS+' '+par(y1), nf(x2)+' '+MINUS+' '+par(x1))+' = '+vH(m,mode)+'. Setze jetzt P ein.',
      nf(y1)+' = '+vH(m,mode)+' &middot; '+par(x1)+' + '+mv('b')+'. Löse nach '+mv('b')+' auf.'
    ],
    sol: ol([
      mv('m')+' = '+mfrac(nf(dy), nf(dx))+' = '+vH(m,mode),
      'P einsetzen: '+nf(y1)+' = '+vH(m,mode)+' &middot; '+par(x1)+' + '+mv('b')+', also '+nf(y1)+' = '+vH(m*x1,mode)+' + '+mv('b'),
      mv('b')+' = '+nf(y1)+' '+MINUS+' '+(m*x1<0 ? '('+vH(m*x1,mode)+')' : vH(m*x1,mode))+' = '+vH(b,mode),
      'Gleichung: '+linH(m,b,null,mode)+'. Die Gerade '+(m>0 ? 'steigt' : 'fällt')+', weil '+mv('m')+(m>0 ? ' &gt; 0' : ' &lt; 0')+' ist.'
    ]),
    solFig: (L<3 ? triFig(x1,y1,x2,y2) : ''),
    specs:[
      {k:'m', x:m, tol:tm, lab:mv('m'), d:mDiag(m,dy,dx).concat([[b,'Du hast '+mv('m')+' und '+mv('b')+' vertauscht.']]), miss:'Prüfe die Steigung.'},
      {k:'b', x:b, tol:tb, lab:mv('b'), d:[[y1+m*x1,'Beim Auflösen nach '+mv('b')+' stimmt das Vorzeichen nicht: '+mv('b')+' = '+mv('y')+' '+MINUS+' '+mv('m')+'&middot;'+mv('x')+'.'],[m,'Du hast '+mv('m')+' und '+mv('b')+' vertauscht.'],[y1,mv('b')+' ist nicht der '+mv('y')+'-Wert von P, sondern der '+mv('y')+'-Achsenabschnitt.']], miss:'Setze einen Punkt ein und löse nach '+mv('b')+' auf.'},
      {k:'dir', c:(m>0 ? 's' : 'f'), d:{s:'Bei negativer Steigung fällt die Gerade.', f:'Bei positiver Steigung steigt die Gerade.'}}
    ],
    okMsg:'Richtig: '+linH(m,b,null,mode)+'.',
    ans:{m:ansStr(m), b:ansStr(b), dir:(m>0 ? 's' : 'f')}, data:{x1:x1,y1:y1,x2:x2,y2:y2},
    sig:'S2|'+[x1,y1,x2,y2].join(',')
  });
}

/* ---------- Geraden im Kästchenmodell (für S3, Z3) ----------
   Die Gerade läuft durch Gitterpunkte; gx, gy = Wert je Kästchen. */
function cellLine(L, scaled){
  var gx = 1, gy = 1, i, j, ox, oy, bc, tries = 0, nx = 12, ny = 12;
  if(scaled){
    var pairs = [[1,5],[1,10],[2,5],[2,10],[1,2],[0.5,1],[2,1],[5,10],[1,20],[0.5,2],[10,5],[2,0.5]];
    var pr = pick(pairs); gx = pr[0]; gy = pr[1];
  }
  do{
    tries++;
    if(L===1 && !scaled){ i = 1; j = pick([1,2,3,-1,-2,-3]); }
    else { i = pick([1,2,3,4]); j = pick([1,2,3,-1,-2,-3,4,-4,5,-5]); if(gcd(i,j)!==1) continue; if(i===1 && Math.abs(j)>3) continue; }
    ox = scaled ? pick([1,2,3]) : 6; oy = scaled ? ri(1,6) : 6;
    if(!scaled){ bc = oy + ri(L===1 ? -3 : -4, L===1 ? 3 : 4); }
    else { bc = oy + ri(-2,5); if(j<0) bc = oy + ri(2,8); }
    if(bc<1 || bc>ny-1) continue;
    /* sichtbare Gitterpunkte zählen */
    var cnt = 0, cx, cy;
    for(cx=0; cx<=nx; cx++){ cy = bc + j*(cx-ox)/i; if(Math.abs(cy-Math.round(cy))<1e-9 && cy>=0 && cy<=ny) cnt++; }
    if(cnt<3) continue;
    break;
  } while(tries<200);
  var m = (j*gy)/(i*gx), b = (bc-oy)*gy;
  return {m:m, b:b, gx:gx, gy:gy, i:i, j:j, xmin:-ox*gx, xmax:(nx-ox)*gx, ymin:-oy*gy, ymax:(ny-oy)*gy, mk:j/i};
}
function cellPoints(c){
  var out = [], x, y;
  for(x=c.xmin; x<=c.xmax+1e-9; x+=c.gx){
    y = c.m*x + c.b;
    if(y>=c.ymin-1e-9 && y<=c.ymax+1e-9 && Math.abs(y/c.gy - Math.round(y/c.gy))<1e-9) out.push([rd(x,6),rd(y,6)]);
  }
  return out;
}
function cellPlot(c, extra){
  var o = {xmin:c.xmin, xmax:c.xmax, ymin:c.ymin, ymax:c.ymax, gx:c.gx, gy:c.gy, lines:[{m:c.m, b:c.b, col:'var(--c1)'}]};
  if(extra) extra(o);
  return plot(o);
}

/* ---------- S3 Gleichung aus dem Graphen ---------- */
function genS3(L){
  var c = cellLine(L, L===3);
  var mode = 'frac';
  var P = cellPoints(c);
  var A = P[0], B = P[Math.min(P.length-1, 0+Math.max(1, Math.round(c.i*(c.gx===1 ? 1 : 1))))];
  /* zwei gut ablesbare Gitterpunkte, möglichst einer auf der y-Achse */
  var k, a0 = null;
  for(k=0;k<P.length;k++) if(Math.abs(P[k][0])<1e-9) a0 = k;
  if(a0!==null){ A = P[a0]; B = P[a0+1] ? P[a0+1] : P[a0-1]; }
  if(B[0]<A[0]){ var t = A; A = B; B = t; }
  var dy = B[1]-A[1], dx = B[0]-A[0];
  var tm = tolFor(c.m), tb = tolFor(c.b);
  var body = '<p>Die Abbildung zeigt den Graphen einer linearen Funktion '+mv('f')+'.</p>'
    + figure(cellPlot(c), '<b>Abb.:</b> Graph von '+mv('f')+(L===3 ? '. Achte auf die Einteilung der Achsen.' : ''))
    + '<p><b>Bestimme</b> die Funktionsgleichung '+fx('f')+' = '+mv('m')+mv('x')+' + '+mv('b')+'.</p>'
    + fields(fld(mv('m')+' =','m'), fld(mv('b')+' =','b'));
  var d = mDiag(c.m, dy, dx);
  if(L===3 && !near(c.mk, c.m)) d.unshift([c.mk, 'Du hast Kästchen gezählt. Die Achsen sind aber verschieden eingeteilt: Lies die Werte an den Achsen ab, nicht die Kästchen.']);
  if(L===3 && !near(1/c.mk, c.m) && c.mk!==0) d.push([1/c.mk, 'Du hast Kästchen gezählt und dazu noch hoch und rüber vertauscht.']);
  d.push([c.b, 'Du hast '+mv('m')+' und '+mv('b')+' vertauscht.']);
  var xs0 = -c.b/c.m;
  return mkTask({
    type:'S3', level:L, op:'Bestimme', title:'Gleichung aus dem Graphen', body:body,
    hints:[
      mv('b')+' liest du dort ab, wo der Graph die '+mv('y')+'-Achse schneidet. Für '+mv('m')+' brauchst du ein Steigungsdreieck zwischen zwei Gitterpunkten.',
      'Gut ablesbar sind zum Beispiel '+ptH('A',A[0],A[1])+' und '+ptH('B',B[0],B[1])+'.'+(L===3 ? ' Lies die Koordinaten an den Achsen ab.' : ''),
      DX()+' = '+nf(dx)+' und '+DY()+' = '+nf(dy)+', also '+mv('m')+' = '+mfrac(nf(dy),nf(dx))+'.'
    ],
    sol: ol([
      'Schnitt mit der '+mv('y')+'-Achse bei '+nf(c.b)+', also '+mv('b')+' = '+vH(c.b,mode)+'.',
      'Steigungsdreieck von '+ptH('A',A[0],A[1])+' nach '+ptH('B',B[0],B[1])+': '+DX()+' = '+nf(dx)+', '+DY()+' = '+nf(dy)+'.',
      mv('m')+' = '+mfrac(nf(dy),nf(dx))+' = '+vH(c.m,mode)+(L===3 && !near(c.mk,c.m) ? ' (Kästchen gezählt hätte '+vH(c.mk,mode)+' ergeben)' : ''),
      'Gleichung: '+linH(c.m,c.b,'f',mode)
    ]),
    solFig: figure(cellPlot(c, function(o){
      o.tris = [{x1:A[0],y1:A[1],x2:B[0],y2:B[1],tx:svgDX()+' = '+nf(dx),ty:svgDY()+' = '+nf(dy)}];
      o.pts = [{x:A[0],y:A[1],lab:'A'},{x:B[0],y:B[1],lab:'B'}];
    }), '<b>Abb.:</b> Steigungsdreieck'),
    specs:[
      {k:'m', x:c.m, tol:tm, lab:mv('m'), d:d, miss:'Prüfe dein Steigungsdreieck.'},
      {k:'b', x:c.b, tol:tb, lab:mv('b'), d:[[xs0,'Das ist die Nullstelle. '+mv('b')+' liest du auf der '+mv('y')+'-Achse ab.'],[c.m,'Du hast '+mv('m')+' und '+mv('b')+' vertauscht.'],[-c.b,'Prüfe das Vorzeichen von '+mv('b')+'.']], miss:'Lies '+mv('b')+' am Schnittpunkt mit der '+mv('y')+'-Achse ab.'}
    ],
    okMsg:'Richtig: '+linH(c.m,c.b,'f',mode)+'.',
    ans:{m:ansStr(c.m), b:ansStr(c.b)}, data:{m:c.m, b:c.b, gx:c.gx, gy:c.gy, A:A, B:B},
    sig:'S3|'+[c.m,c.b,c.gx,c.gy,c.xmin,c.ymin].join(',')
  });
}

/* ---------- S4 Punktprobe ---------- */
function genS4(L){
  var m, b, x1, x2, y1, y2, xa, ya, on, given, mode = 'frac', qq, p;
  on = rnd(2)===0;
  if(L===1){
    m = pick([2,3,-2,-3,0.5,-1,4]); b = ri(-5,5);
    xa = ri(-4,6); if(m===0.5 && xa%2!==0) xa++;
  } else if(L===2){
    m = pick([1,2,3,-1,-2,-3,-4]); b = ri(-6,6);
    x1 = ri(-4,1); x2 = x1 + ri(2,5); xa = pick([-6,-5,7,8,9,10]);
  } else {
    qq = pick([2,3,4]); do{ p = ri(-5,5); } while(p===0 || gcd(p,qq)!==1);
    m = p/qq; b = ri(-4,4);
    x1 = qq*ri(-2,0); x2 = x1 + qq*ri(1,2); xa = ri(-9,9); if(xa===x1 || xa===x2) xa += 1;
  }
  var yt = m*xa + b;
  if(on){ ya = yt; }
  else if(L===3 && !terminates(yt,2)){ ya = rd(yt,1); }
  else { ya = yt + ((L===3) ? pick([0.5,-0.5,1,-1]) : pick([1,2,-1,-2,3])); }
  on = near(ya,yt);
  if(L>1){ y1 = m*x1+b; y2 = m*x2+b; }
  var tolA = tolFor(yt);
  var intro = (L===1) ? '<p>Gegeben ist die Gerade '+linH(m,b,'f',mode)+' und der Punkt '+ptH('A',xa,ya)+'.</p>'
                       : '<p>Eine Gerade '+mv('f')+' geht durch '+ptH('P',x1,y1)+' und '+ptH('Q',x2,y2)+'. Gegeben ist außerdem der Punkt '+ptH('A',xa,ya)+'.</p>';
  var body = intro
    + '<p><b>Berechne</b> den Funktionswert '+fx('f',nf(xa))+'. <b>Überprüfe</b> damit, ob A auf der Geraden liegt.</p>'
    + fields(fld(fx('f',nf(xa))+' =','fa'))
    + segc('on', [['ja','A liegt auf der Geraden'],['nein','A liegt nicht auf der Geraden']]);
  var steps = [];
  if(L>1) steps.push('Gleichung aufstellen: '+mv('m')+' = '+mfrac(nf(y2-y1),nf(x2-x1))+' = '+vH(m,mode)+', '+mv('b')+' = '+vH(b,mode)+', also '+linH(m,b,'f',mode));
  steps.push('Einsetzen: '+fx('f',nf(xa))+' = '+vH(m,mode)+' &middot; '+par(xa)+(b===0 ? '' : (b<0 ? ' '+MINUS+' '+vH(-b,mode) : ' + '+vH(b,mode)))+' = '+vH(yt,mode)+(tolA>0 ? ' &asymp; '+nf(yt,2) : ''));
  steps.push('Vergleich mit der '+mv('y')+'-Koordinate von A: '+vH(yt,mode)+(on ? ' = ' : ' &ne; ')+nf(ya)+'. A liegt '+(on ? '' : 'nicht ')+'auf der Geraden.');
  return mkTask({
    type:'S4', level:L, op:'Überprüfe', title:'Punktprobe', body:body,
    hints:[
      'Ein Punkt liegt auf der Geraden, wenn seine '+mv('y')+'-Koordinate genau der Funktionswert an seiner '+mv('x')+'-Stelle ist.',
      (L>1 ? 'Stelle zuerst die Gleichung auf: '+mv('m')+' = '+mfrac(DY(),DX())+', dann '+mv('b')+' aus einem Punkt. ' : '')+'Setze '+mv('x')+' = '+nf(xa)+' ein.',
      fx('f',nf(xa))+' = '+vH(yt,mode)+(tolA>0 ? ' &asymp; '+nf(yt,2) : '')+'. Vergleiche mit '+nf(ya)+'.'
    ],
    sol: ol(steps),
    specs:[
      {k:'fa', x:yt, tol:tolA, lab:fx('f',nf(xa)), d:[[ya,'Du hast die '+mv('y')+'-Koordinate von A übernommen. Berechne '+fx('f',nf(xa))+' selbst aus der Gleichung.'],[-m*xa+b,'Achte beim Einsetzen auf das Vorzeichen von '+mv('x')+'.']], miss:'Setze '+mv('x')+' = '+nf(xa)+' in die Gleichung ein.'},
      {k:'on', c:(on ? 'ja' : 'nein'), d:{ja:'Vergleiche '+fx('f',nf(xa))+' genau mit der '+mv('y')+'-Koordinate von A.', nein:'Vergleiche '+fx('f',nf(xa))+' genau mit der '+mv('y')+'-Koordinate von A.'}}
    ],
    okMsg:'Richtig. A liegt '+(on ? '' : 'nicht ')+'auf der Geraden.',
    ans:{fa:ansStr(yt), on:(on ? 'ja' : 'nein')}, data:{m:m,b:b,xa:xa,ya:ya,x1:x1,y1:y1,x2:x2,y2:y2,L:L},
    sig:'S4|'+[m,b,xa,ya,x1,x2].join(',')
  });
}

/* ---------- S5 Steigung in Prozent ---------- */

    sol = ol([nf(p)+'&thinsp;% heißt '+mv('m')+' = '+mfrac(nf(p),'100')+' = '+nf(p/100)+'.', 'Höhenunterschied = '+nf(p/100)+' &middot; '+q(d,'m')+' = '+q(h,'m')+'.']);
    ans = {h:ansStr(h)};
  } else if(L===2){
    do{ p = pick([2.5,3.5,4,4.5,6,7.5,8,9,12.5,14,16]); d = pick([200,240,300,400,500,600,800,1200]); h = p*d/100; } while(!terminates(h,1));
    body = '<p>Ein Weg steigt auf einer waagerecht gemessenen Strecke von '+q(d,'m')+' um '+q(h,'m')+' an.</p><p><b>Berechne</b> die Steigung in Prozent.</p>'

    specs = [{k:'p', x:p, lab:'die Steigung', d:[[p/100,'Das ist die Steigung '+mv('m')+' als Dezimalzahl. In Prozent: mal 100.'],[100*d/h,'Du hast Strecke durch Höhe gerechnet. Richtig ist Höhe durch Strecke.']], miss:'Teile die Höhe durch die waagerechte Strecke.'}];

    ans = {p:ansStr(p)};

    body = '<p>'+c.t.replace('{p}',nf(p))+'</p><p><b>Berechne</b>, wie lang die waagerecht gemessene Strecke ist, auf der '+c.g+' um '+q(h,'m')+' ansteigt.</p>'

/* ---------- S6 Fehler finden: Steigung ---------- */
function genS6(L){
  var v = (L===1) ? pick(['b','gl','vor']) : (L===2 ? pick(['tausch','prozent','vor']) : pick(['kaest','tausch2','paral']));

      {h:'Ben irrt sich. Es gilt '+mv('b')+' = '+vH(-b)+', das Vorzeichen muss man umdrehen.', ok:false, why:'Das Vorzeichen bleibt: Setze '+mv('x')+' = 0 ein.'}];
    o.sol = ol(['Für '+mv('x')+' = 0 gilt '+mv('y')+' = '+vH(b)+'. Das ist der '+mv('y')+'-Achsenabschnitt '+mv('b')+'.', 'Ben hat die Nullstelle '+mv('x')+' = '+vH(ns)+' berechnet.']);

    o.body = '<p>Mia liest an der Gleichung '+gl+' ab: „Die Steigung ist '+nf(b)+', weil die '+nf(b)+' vorne steht.“</p><p><b>Beurteile</b> Mias Aussage.</p>';
    opts = [{h:'Mia irrt sich. Die Steigung ist die Zahl, die mit '+mv('x')+' multipliziert wird: '+mv('m')+' = '+nf(m)+'.', ok:true},
      {h:'Mia hat recht. Die erste Zahl einer Gleichung ist immer die Steigung.', ok:false, why:'Die Reihenfolge der Summanden ist egal. Entscheidend ist, was bei '+mv('x')+' steht.'},
      {h:'Mia irrt sich. Die Steigung ist '+nf(Math.abs(m))+', ein Minus gehört nie zur Steigung.', ok:false, why:'Das Minus gehört dazu: Die Gerade fällt.'},
      {h:'Mia irrt sich. Die Steigung ist '+nf(m+b)+', man muss beide Zahlen addieren.', ok:false, why:'Steigung und Achsenabschnitt werden nicht addiert.'}];
    o.sol = ol(['Umsortiert: '+linH(m,b)+'.', 'Die Steigung ist '+mv('m')+' = '+nf(m)+', der Achsenabschnitt '+mv('b')+' = '+nf(b)+'.']);
    o.sig = 'S6g|'+m+'|'+b;
  } else if(v==='vor' || v==='tausch' || v==='tausch2'){
    do{ x1 = ri(-5,4); x2 = x1 + ri(1,5); y1 = ri(-6,6); y2 = ri(-6,6); } while(y1===y2 || Math.abs(y2-y1)===Math.abs(x2-x1));
    dy = y2-y1; dx = x2-x1; m = dy/dx;
    var who = pick(['Lea','Tom','Ida','Can']);

    if(v==='vor'){

    } else {
      wrong = dx/dy;
      wrongTxt = mv('m')+' = '+mfrac(nf(x2)+' '+MINUS+' '+par(x1), nf(y2)+' '+MINUS+' '+par(y1))+' = '+vH(wrong);

    opts = [{h:rightOpt, ok:true},

    o.sol = ol([DY()+' = '+nf(y2)+' '+MINUS+' '+par(y1)+' = '+nf(dy)+' und '+DX()+' = '+nf(x2)+' '+MINUS+' '+par(x1)+' = '+nf(dx)+'.', mv('m')+' = '+mfrac(nf(dy),nf(dx))+' = '+vH(m)+'.', 'Fehler: '+rightOpt]);
    o.sig = 'S6'+v+'|'+[x1,y1,x2,y2].join(',');
  } else if(v==='prozent'){
    var p = pick([6,8,10,12,15,20]);
    o.body = '<p>An einer Straße steht ein Schild mit der Angabe '+nf(p)+'&thinsp;% Steigung. Jan sagt: „Die Straße ist also um '+nf(p)+'° geneigt.“</p><p><b>Beurteile</b> Jans Aussage.</p>';
    opts = [{h:'Jan irrt sich. '+nf(p)+'&thinsp;% heißt: Auf 100&thinsp;m waagerecht steigt die Straße um '+nf(p)+'&thinsp;m. Das ist eine Steigung, kein Winkel.', ok:true},
      {h:'Jan hat recht. Prozent und Grad bedeuten bei Steigungen dasselbe.', ok:false, why:'Prozent beschreibt ein Verhältnis von Höhe zu Strecke, Grad einen Winkel.'},
      {h:'Jan irrt sich. '+nf(p)+'&thinsp;% heißt: Auf 100&thinsp;m Straße steigt man '+nf(100-p)+'&thinsp;m.', ok:false, why:'Pro 100&thinsp;m waagerecht steigt man '+nf(p)+'&thinsp;m.'},
      {h:'Jan irrt sich. '+nf(p)+'&thinsp;% heißt '+mv('m')+' = '+nf(p)+'.', ok:false, why:nf(p)+'&thinsp;% = '+mfrac(nf(p),'100')+' = '+nf(p/100)+'.'}];
    o.sol = ol([nf(p)+'&thinsp;% = '+mfrac(nf(p),'100')+', also '+mv('m')+' = '+nf(p/100)+'.', 'Das bedeutet '+nf(p)+'&thinsp;m Höhe auf 100&thinsp;m waagerecht. Ein Winkel ist eine andere Größe.']);
    o.sig = 'S6p|'+p;
  } else if(v==='kaest'){
    var c = cellLine(3, true);
    while(near(c.mk, c.m)) c = cellLine(3, true);
    o.body = '<p>Lea bestimmt die Steigung des Graphen: „Ich gehe '+nf(c.i)+' Kästchen nach rechts und '+nf(Math.abs(c.j))+' Kästchen nach '+(c.j>0 ? 'oben' : 'unten')+'. Also ist '+mv('m')+' = '+vH(c.mk,'frac')+'.“</p>'
      + figure(cellPlot(c), '<b>Abb.:</b> Achsen verschieden eingeteilt')
      + '<p><b>Beurteile</b> Leas Vorgehen.</p>';
    opts = [{h:'Lea irrt sich. Ein Kästchen bedeutet nach rechts '+nf(c.gx)+' und nach oben '+nf(c.gy)+'. Richtig ist '+mv('m')+' = '+vH(c.m,'frac')+'.', ok:true},
      {h:'Lea hat recht. Kästchenzählen funktioniert immer.', ok:false, why:'Nur wenn beide Achsen gleich eingeteilt sind.'},
      {h:'Lea irrt sich. Richtig ist '+mv('m')+' = '+vH(c.mk===0 ? 1 : 1/c.mk,'frac')+', sie hat rechts und oben vertauscht.', ok:false, why:'Rechts und oben hat Lea richtig zugeordnet. Das Problem ist die Einteilung.'},
      {h:'Lea irrt sich. Richtig ist '+mv('m')+' = '+vH(-c.m,'frac')+'.', ok:false, why:'Schau auf die Richtung: '+(c.m>0 ? 'Der Graph steigt.' : 'Der Graph fällt.')}];
    o.sol = ol(['Ein Kästchen nach rechts: '+nf(c.gx)+'. Ein Kästchen nach oben: '+nf(c.gy)+'.', DX()+' = '+nf(c.i)+' &middot; '+nf(c.gx)+' = '+nf(c.i*c.gx)+', '+DY()+' = '+nf(c.j)+' &middot; '+nf(c.gy)+' = '+nf(c.j*c.gy)+'.', mv('m')+' = '+mfrac(nf(c.j*c.gy),nf(c.i*c.gx))+' = '+vH(c.m,'frac')+'.']);
    o.sig = 'S6k|'+[c.m,c.b,c.gx,c.gy].join(',');
  } else {
    m = pick([2,3,-2,0.5,-0.5,1.5]); b = ri(-3,3); var b2 = b + pick([2,3,-2,4]);
    var who2 = pick(['Nele','Paul','Sami']);
    o.body = '<p>'+who2+' behauptet: „Die Geraden '+linH(m,b,'f','frac')+' und '+linH(m,b2,'g','frac')+' schneiden sich irgendwo weit draußen, man sieht es nur nicht.“</p><p><b>Beurteile</b> die Behauptung.</p>';
    opts = [{h:'Falsch. Beide Geraden haben dieselbe Steigung '+vH(m,'frac')+', aber verschiedene Achsenabschnitte. Sie sind parallel und schneiden sich nie.', ok:true},
      {h:'Richtig. Zwei Geraden schneiden sich immer irgendwo.', ok:false, why:'Parallele Geraden schneiden sich nicht.'},
      {h:'Richtig. Sie schneiden sich bei '+mv('x')+' = '+nf(b2-b)+'.', ok:false, why:'Gleichsetzen führt auf '+nf(b)+' = '+nf(b2)+'. Das hat keine Lösung.'},
      {h:'Falsch. Sie sind sogar dieselbe Gerade.', ok:false, why:'Die Achsenabschnitte '+nf(b)+' und '+nf(b2)+' sind verschieden.'}];
    o.sol = ol(['Beide Steigungen sind '+vH(m,'frac')+'.', 'Gleichsetzen: '+linH(m,b,null,'frac').replace(mv('y')+' = ','')+' = '+linH(m,b2,null,'frac').replace(mv('y')+' = ','')+' führt auf '+nf(b)+' = '+nf(b2)+'. Das ist falsch, es gibt keinen Schnittpunkt.']);
    o.sig = 'S6q|'+m+'|'+b+'|'+b2;
  }
  o.hints = ['Rechne die Aufgabe zuerst selbst, bevor du die Antworten liest.', 'Vergleiche dein Ergebnis mit dem der Person. Wo weicht es ab?', 'Genau eine Erklärung nennt den Fehler und das richtige Ergebnis.'];
  return mcTask(o, opts);
}

/* ============================================================
   Bereich B: Graphen und Gleichungen (Z1 bis Z3)
   ============================================================ */
var LCOL = ['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)'];
var FNAMES = ['f','g','h','k','p'];
function latticeCount(m,b,lo,hi){
  var n = 0, x, y;
  for(x=lo;x<=hi;x++){ y = m*x+b; if(Math.abs(y-Math.round(y))<1e-9 && y>=lo && y<=hi) n++; }
  return n;
}
function sameLine(a,b){ return near(a.m,b.m) && near(a.b,b.b); }
function eqH(e, name, mode, bFirst){
  if(bFirst && e.m!==0 && e.b!==0){
    return fx(name)+' = '+vH(e.b,mode)+' '+(e.m<0 ? MINUS : '+')+' '+(Math.abs(e.m)===1 ? '' : vH(Math.abs(e.m),mode)+(fracOf(e.m,12).d>1 ? THIN : ''))+mv('x');
  }
  return linH(e.m, e.b, name, mode);
}
function lineDiag(chosen, right){
  if(near(chosen.m,right.m)) return 'Die Steigung passt, aber der '+mv('y')+'-Achsenabschnitt nicht.';
  if(near(chosen.b,right.b) && near(chosen.m,-right.m)) return 'Der Achsenabschnitt passt, aber die Gerade '+(right.m>0 ? 'steigt' : 'fällt')+'. Prüfe das Vorzeichen der Steigung.';
  if(near(chosen.b,right.b)) return 'Der Achsenabschnitt passt, aber die Steigung nicht. Zeichne ein Steigungsdreieck.';
  if(near(chosen.m,right.b) && near(chosen.b,right.m)) return 'Hier sind '+mv('m')+' und '+mv('b')+' vertauscht.';
  return 'Lies zuerst den Schnittpunkt mit der '+mv('y')+'-Achse ab, dann die Steigung.';
}

/* ---------- Z1 Mehrere Graphen zuordnen ---------- */
function genZ1(L){
  var eqs = [], nG = (L===1) ? 3 : 4, nE = (L===1) ? 3 : 5, tries = 0, i, j, e;
  function ok(e){
    if(Math.abs(e.b)>4) return false;
    if(latticeCount(e.m,e.b,-6,6)<2) return false;
    for(j=0;j<eqs.length;j++) if(sameLine(eqs[j],e)) return false;
    return true;
  }
  function add(e){ if(ok(e)){ eqs.push(e); return true; } return false; }
  while(eqs.length<nE && tries<400){
    tries++;
    if(L===1){
      e = {m:pick([1,2,3,-1,-2,-3]), b:ri(-3,3)};
      var clash = false;
      for(j=0;j<eqs.length;j++) if(near(eqs[j].m,e.m) || near(eqs[j].b,e.b)) clash = true;
      if(!clash) add(e);
    } else if(L===2){
      if(eqs.length===0){ add({m:pick([1,2,-1,-2,3,-3]), b:ri(-3,3)}); continue; }
      var base = eqs[0], r = eqs.length;
      if(r===1) add({m:base.m, b:base.b + pick([2,3,-2,-3])});
      else if(r===2) add({m:-base.m, b:base.b});
      else if(r===3) add({m:pick([0.5,-0.5,2/3,-2/3,1.5,-1.5,1/3,-1/3]), b:ri(-3,3)});
      else add(rnd(2)===0 ? {m:0, b:pick([-3,-2,2,3,4])} : {m:pick([0.5,-0.5,2,-2,1/3,3]), b:ri(-4,4)});
    } else {
      if(eqs.length===0){ var mm = pick([2,3,-2,-3,4]), bb = pick([1,-1,2,-2]); if(Math.abs(mm)===Math.abs(bb)) bb = 1; add({m:mm, b:bb}); continue; }
      var b0 = eqs[0], r3 = eqs.length;
      if(r3===1) add({m:b0.b, b:b0.m});
      else if(r3===2) add({m:pick([0.5,-0.5,1/3,-1/3]), b:ri(-3,3)});
      else if(r3===3) add({m:1/eqs[2].m, b:eqs[2].b + pick([1,-1,2])});
      else add({m:pick([2/3,-2/3,1.5,-1.5,-1,1]), b:ri(-4,4)});
    }
    if(tries%60===0) eqs = [];
  }
  /* Namen vergeben und mischen */
  var named = shuffle(eqs).map(function(e,ix){ return {m:e.m, b:e.b, n:FNAMES[ix]}; });
  var graphs = shuffle(named).slice(0,nG);
  var rest = null;
  for(i=0;i<named.length;i++){ var used = false; for(j=0;j<graphs.length;j++) if(graphs[j]===named[i]) used = true; if(!used) rest = named[i]; }
  var mode = 'frac';
  var lines = graphs.map(function(g,ix){ return {m:g.m, b:g.b, col:LCOL[ix], lab:String(ix+1)}; });
  var eqList = '<div class="given eqlist">';
  for(i=0;i<named.length;i++) eqList += '<span>'+eqH(named[i], named[i].n, mode, L===3 && i%2===1)+'</span>';
  eqList += '</div>';
  var opts = named.map(function(e){ return [e.n, e.n]; });
  var sel = '';
  for(i=0;i<nG;i++) sel += selc('g'+(i+1), opts, 'Graph ('+(i+1)+')');
  if(rest) sel += selc('rest', opts, 'übrig bleibt');
  var body = '<p>'+(L===1 ? 'Gegeben sind drei lineare Funktionen. Ihre Graphen siehst du in der Abbildung.' : 'Gegeben sind fünf lineare Funktionen. Vier davon sind in der Abbildung als Graph dargestellt.')+'</p>'
    + eqList
    + figure(plot({xmin:-6,xmax:6,ymin:-6,ymax:6, lines:lines, cell:27}), '<b>Abb.:</b> '+(L===1 ? 'drei' : 'vier')+' Graphen')
    + '<p><b>Ordne</b> jedem Graphen die passende Funktion <b>zu</b>.'+(rest ? ' <b>Gib an</b>, welche Funktion übrig bleibt.' : '')+'</p>'
    + '<div class="fields">'+sel+'</div>';
  var specs = [], ans = {}, steps = [];
  for(i=0;i<nG;i++){
    var g = graphs[i], dd = {};
    for(j=0;j<named.length;j++) if(named[j]!==g) dd[named[j].n] = 'Graph ('+(i+1)+'): '+lineDiag(named[j], g);
    specs.push({k:'g'+(i+1), c:g.n, d:dd});
    ans['g'+(i+1)] = g.n;
    steps.push('Graph ('+(i+1)+'): schneidet die '+mv('y')+'-Achse bei '+vH(g.b,mode)+' und hat die Steigung '+vH(g.m,mode)+'. Das ist '+eqH(g,g.n,mode)+'.');
  }
  if(rest){ specs.push({k:'rest', c:rest.n, d:{}}); ans.rest = rest.n; steps.push('Übrig bleibt '+eqH(rest,rest.n,mode)+'.'); }
  return mkTask({
    type:'Z1', level:L, op:'Ordne zu', title:'Mehrere Graphen zuordnen', body:body,
    hints:[
      'Gehe Graph für Graph vor. Lies zuerst ab, wo er die '+mv('y')+'-Achse schneidet. Das ist '+mv('b')+'.',
      'Haben zwei Funktionen dasselbe '+mv('b')+', entscheidet die Steigung: Steigt oder fällt der Graph? Wie steil?',
      'Zeichne bei jedem Graphen ein Steigungsdreieck: 1 nach rechts, dann '+mv('m')+' nach oben oder unten. Bei Brüchen: '+mv('q')+' nach rechts, '+mv('p')+' nach oben.'
    ],
    sol: ol(steps),
    specs:specs, okMsg:'Alle Zuordnungen stimmen.',
    ans:ans, data:{graphs:graphs, named:named, rest:rest},
    sig:'Z1|'+named.map(function(e){ return e.n+e.m.toFixed(3)+'/'+e.b; }).join(';')+'|'+graphs.map(function(g){ return g.n; }).join('')
  });
}

/* ---------- Z2 Gerade zeichnen (Punkte ziehen) ---------- */
function genZ2(L){
  var m, b, p, qq, px, py, tries = 0, desc;
  do{
    tries++;
    if(L===1){ m = pick([1,2,3,-1,-2,-3]); b = ri(-3,3); }
    else if(L===2){ qq = pick([2,3]); do{ p = ri(-4,4); } while(p===0 || gcd(p,qq)!==1); m = p/qq; b = ri(-3,3); }
    else {
      qq = pick([2,3,4]); do{ p = ri(-4,4); } while(p===0 || gcd(p,qq)!==1); m = p/qq;
      px = ri(-4,4); py = ri(-4,4); b = py - m*px;
      if(Math.abs(b)>8) continue;
    }
    if(latticeCount(m,b,-6,6)>=2) break;
  } while(tries<200);
  var mode = 'frac';
  if(L<3) desc = 'Zeichne den Graphen von '+linH(m,b,'f',mode)+'.';
  else desc = 'Eine Gerade hat die Steigung '+mv('m')+' = '+vH(m,mode)+' und geht durch den Punkt '+ptH('P',px,py)+'. Zeichne sie.';
  var init = [[-5,-5],[5,-5]];
  if(near(m*init[0][0]+b, init[0][1])) init[0] = [-5,5];
  if(near(m*init[1][0]+b, init[1][1])) init[1] = [5,5];
  var body = '<p>'+desc.replace('Zeichne','<b>Zeichne</b>')+'</p>'
    + '<p class="hintline">Ziehe die Punkte A und B auf zwei Gitterpunkte der Geraden. Die Gerade erscheint von selbst.</p>'
    + figure(plot({xmin:-6,xmax:6,ymin:-6,ymax:6, cell:29, drag:{init:init}, pts:(L===3 ? [{x:px,y:py,lab:'P',col:'var(--c2)'}] : [])}), '<b>Abb.:</b> Ziehe A und B.')
    + '<input type="hidden" data-k="x1" value=""><input type="hidden" data-k="y1" value=""><input type="hidden" data-k="x2" value=""><input type="hidden" data-k="y2" value="">';
  var pts = [], x;
  for(x=-6;x<=6;x++){ var y = m*x+b; if(Math.abs(y-Math.round(y))<1e-9 && y>=-6 && y<=6) pts.push([x,Math.round(y)]); }
  var a1 = pts[0], a2 = pts[pts.length-1];
  var steps = [];
  if(L===3) steps.push('Starte im Punkt '+ptH('P',px,py)+'.');
  else steps.push('Starte auf der '+mv('y')+'-Achse im Punkt (0 | '+vH(b,mode)+')'+(near(b,Math.round(b)) ? '' : '')+'.');
  var fm = fracOf(m,12);
  steps.push('Steigung '+vH(m,mode)+': '+nf(fm.d)+' nach rechts und '+nf(Math.abs(fm.n))+' nach '+(m>0 ? 'oben' : 'unten')+'.');
  steps.push('Gitterpunkte der Geraden sind zum Beispiel '+pts.slice(0,3).map(function(p){ return '('+nf(p[0])+' | '+nf(p[1])+')'; }).join(', ')+'.');
  return mkTask({
    type:'Z2', level:L, op:'Zeichne', title:'Gerade zeichnen', body:body, drag:true,
    hints:[
      L<3 ? 'Der erste Punkt liegt auf der '+mv('y')+'-Achse bei '+mv('b')+' = '+vH(b,mode)+'.' : 'Der erste Punkt ist P selbst.',
      'Die Steigung '+vH(m,mode)+' heißt: '+nf(fm.d)+' Kästchen nach rechts, '+nf(Math.abs(fm.n))+' Kästchen nach '+(m>0 ? 'oben' : 'unten')+'.',
      'Zum Beispiel liegen '+'('+nf(a1[0])+' | '+nf(a1[1])+')'+' und '+'('+nf(a2[0])+' | '+nf(a2[1])+')'+' auf der Geraden.'
    ],
    sol: ol(steps),
    solFig: figure(plot({xmin:-6,xmax:6,ymin:-6,ymax:6, cell:24, lines:[{m:m,b:b}], pts:pts.map(function(p){ return {x:p[0],y:p[1]}; })}), '<b>Abb.:</b> richtige Gerade mit ihren Gitterpunkten'),
    check:function(v){
      if(v.x1==='' || v.x1===undefined) return {status:'wrong', nosel:true, msg:'Ziehe zuerst die Punkte A und B.', marks:{}};
      var X1 = +v.x1, Y1 = +v.y1, X2 = +v.x2, Y2 = +v.y2;
      if(X1===X2 && Y1===Y2) return {status:'wrong', nosel:true, msg:'A und B liegen aufeinander. Ziehe sie auseinander.', marks:{}};
      var on1 = near(m*X1+b, Y1), on2 = near(m*X2+b, Y2);
      if(on1 && on2) return {status:'correct', msg:'Die Gerade stimmt.', marks:{}};
      if(X1===X2) return {status:'wrong', msg:'Deine Gerade ist senkrecht. Die gesuchte Gerade ist der Graph einer Funktion.', marks:{}};
      var mm = (Y2-Y1)/(X2-X1), bb = Y1 - mm*X1, msg;
      if(near(mm,m)) msg = 'Die Steigung stimmt, aber die Gerade ist verschoben. '+(L<3 ? 'Sie muss die '+mv('y')+'-Achse bei '+vH(b,mode)+' schneiden.' : 'Sie muss durch P gehen.');
      else if(near(mm,-m)) msg = 'Deine Gerade '+(mm>0 ? 'steigt' : 'fällt')+'. Prüfe das Vorzeichen der Steigung.';
      else if(near(mm,1/m)) msg = 'Du hast rechts und hoch vertauscht. Erst '+nf(fm.d)+' nach rechts, dann '+nf(Math.abs(fm.n))+' nach '+(m>0 ? 'oben' : 'unten')+'.';
      else if(near(bb,b) && L<3) msg = 'Der Achsenabschnitt stimmt, aber die Steigung nicht.';
      else msg = (on1 || on2) ? 'Einer der beiden Punkte liegt richtig. Prüfe den anderen mit dem Steigungsdreieck.' : 'Beide Punkte liegen nicht auf der Geraden.';
      return {status:(on1 || on2) ? 'partial' : 'wrong', msg:msg, marks:{}};
    },
    ans:{x1:String(a1[0]), y1:String(a1[1]), x2:String(a2[0]), y2:String(a2[1])},
    data:{m:m,b:b,px:px,py:py},
    sig:'Z2|'+L+'|'+m.toFixed(4)+'|'+b.toFixed(4)+'|'+px+'|'+py
  });
}

/* ---------- Z3 Eine Gleichung, ein Graph ---------- */
function genZ3(L){
  var c, mode = 'frac', o = {type:'Z3', level:L, op:'Ordne zu', title:'Graph und Gleichung'}, opts = [], cand, i, j;
  var graphPick = (L===2 && rnd(2)===0);
  c = cellLine(L===3 ? 2 : L, L===3);
  if(!graphPick && L<3 && rnd(3)===0){ /* auch Brüche in Stufe 2, ganze Zahlen in Stufe 1 */ }
  var right = {m:c.m, b:c.b};
  cand = [{m:c.b, b:c.m, why:'Hier sind '+mv('m')+' und '+mv('b')+' vertauscht.'},
          {m:-c.m, b:c.b, why:'Die Steigung hat das falsche Vorzeichen.'},
          {m:c.m, b:-c.b, why:'Der '+mv('y')+'-Achsenabschnitt hat das falsche Vorzeichen.'},
          {m:(c.m!==0 ? 1/c.m : 2), b:c.b, why:'Hier ist '+DX()+' durch '+DY()+' gerechnet.'},
          {m:c.m, b:c.b + (c.b>=0 ? -c.gy : c.gy), why:'Der Achsenabschnitt passt nicht.'}];
  if(L===3 && !near(c.mk,c.m)) cand.unshift({m:c.mk, b:c.b, why:'Diese Steigung entsteht durch Kästchenzählen. Die Achsen sind aber verschieden eingeteilt.'});
  var chosen = [right];
  for(i=0;i<cand.length && chosen.length<4;i++){
    var dup = false;
    for(j=0;j<chosen.length;j++) if(sameLine(chosen[j], cand[i])) dup = true;
    if(c.b===0 && cand[i].m===0) dup = true;
    if(!dup) chosen.push(cand[i]);
  }
  if(graphPick){
    o.body = '<p><b>Ordne</b> der Funktion '+linH(c.m,c.b,'f',mode)+' den passenden Graphen <b>zu</b>.</p>';
    opts = chosen.map(function(e,ix){
      return {h:'<span class="optfig">'+plot({xmin:-6,xmax:6,ymin:-6,ymax:6,cell:13,small:true,padL:20,padB:18,lx:2,ly:2,lines:[{m:e.m,b:e.b,col:'var(--c1)'}]})+'</span>', ok:ix===0, why:e.why};
    });
  } else {
    o.body = '<p>Die Abbildung zeigt den Graphen einer linearen Funktion '+mv('f')+'.</p>'
      + figure(cellPlot(c), '<b>Abb.:</b> Graph von '+mv('f')+(L===3 ? '. Achte auf die Einteilung der Achsen.' : ''))
      + '<p><b>Ordne</b> dem Graphen die passende Gleichung <b>zu</b>.</p>';
    opts = chosen.map(function(e,ix){ return {h:linH(e.m,e.b,'f',mode), ok:ix===0, why:e.why}; });
  }
  o.hints = ['Lies ab, wo der Graph die '+mv('y')+'-Achse schneidet. Damit fallen schon Antworten weg.', 'Steigt oder fällt der Graph? Damit kennst du das Vorzeichen von '+mv('m')+'.', 'Zeichne ein Steigungsdreieck zwischen zwei Gitterpunkten'+(L===3 ? ' und lies die Werte an den Achsen ab.' : '.')];
  o.sol = ol(['Schnitt mit der '+mv('y')+'-Achse bei '+vH(c.b,mode)+', also '+mv('b')+' = '+vH(c.b,mode)+'.', 'Steigungsdreieck: '+DX()+' = '+nf(c.i*c.gx)+', '+DY()+' = '+nf(c.j*c.gy)+', also '+mv('m')+' = '+vH(c.m,mode)+'.', 'Passend ist '+linH(c.m,c.b,'f',mode)+'.']);
  o.data = {m:c.m, b:c.b};
  o.sig = 'Z3|'+(graphPick ? 'G' : 'E')+'|'+[c.m,c.b,c.gx,c.gy,c.xmin,c.ymin].join(',');
  return mcTask(o, opts);
}

/* ============================================================
   Bereich C: Tabelle und Funktionsgleichung (W1 bis W5)
   ============================================================ */
var TYPN = {lin:'linear', exp:'exponentiell', pot:'potenziell'};
var TYPOPT = [['lin','linear'],['exp','exponentiell'],['pot','potenziell']];
function allTerm(ys,k){ for(var i=0;i<ys.length;i++) if(!terminates(ys[i],k)) return false; return true; }
function evalT(t,x){
  if(t.typ==='lin') return t.m*x + t.b;
  if(t.typ==='exp') return t.a*Math.pow(t.bb,x);
  return t.a*Math.pow(x,t.n);
}
/* Tabelle erzeugen. Varianten: s = einfach, x0 = ohne Startwert, x2 = Schritt 2, d = x verdoppelt, n = x 1 bis 4 */
function makeTab(typ, L, forced){
  var t, xs, ys, i, tries = 0, v;
  do{
    tries++;
    t = {typ:typ};
    if(typ==='lin'){
      v = forced || (L===1 ? 's' : pick(L===2 ? ['s','x2','n'] : ['n','x2','dec']));
      t.m = (v==='dec') ? pick([2.5,-1.5,0.5,-2.5,1.5,-0.5,3.5]) : pick([2,3,4,5,6,8,10,12,15,20,25,-2,-3,-4,-5,-6,-8,-10,-15,-20]);
      t.b = (v==='dec') ? ri(2,40)/2 : pick([5,10,15,20,30,40,50,60,80,100,120]);
      xs = (v==='s') ? [0,1,2,3] : (v==='x2' ? [0,2,4,6] : [1,2,3,4]);
      if(L===3 && v==='x2') xs = [2,4,6,8];
    } else if(typ==='exp'){
      v = forced || (L===1 ? 's' : (L===2 ? pick(['s','x0']) : pick(['x0','x2','fr'])));
      t.bb = (v==='x2') ? pick([2,3,0.5]) : (v==='fr' ? pick([1/3,0.5,1.5,1.2,0.8]) : pick([2,3,0.5,1.5,4,0.75]));
      t.a = pick([2,3,4,5,8,10,16,20,32,40,48,50,64,80,96,100,128,162,200,250,256,320,400,486,500,810]);
      xs = (v==='s') ? [0,1,2,3] : (v==='x2' ? [1,3,5,7] : [1,2,3,4]);
      if(v==='x2' && L===3 && rnd(2)===0) xs = [0,2,4,6];
    } else {
      v = forced || (L===2 ? 'd' : pick(['n','d','dn','n6']));
      t.n = (v==='dn') ? pick([-1,-2]) : (L===2 ? pick([2,3,-1,-2,2,3]) : pick([2,3,-1,-2]));
      t.a = (t.n>0) ? pick([0.5,1,2,3,4,5,1.5,0.2]) : pick([12,24,36,48,60,72,96,120,144,160,240,288,320,360,480,720]);
      xs = (v==='d') ? [1,2,4,8] : (v==='dn' ? [2,4,8,16] : (v==='n6' ? [1,2,3,4,6] : [1,2,3,4]));
    }
    t.v = v;
    ys = []; for(i=0;i<xs.length;i++) ys.push(rd(evalT(t,xs[i]),6));
    var okv = allTerm(ys,3);
    for(i=0;i<ys.length;i++) if(Math.abs(ys[i])>20000 || (typ!=='lin' && ys[i]<=0)) okv = false;
    if(typ==='lin') for(i=0;i<ys.length;i++) if(ys[i]<0 && L===1) okv = false;
    if(typ==='pot' && t.n<0 && v!=='dn') for(i=0;i<ys.length;i++) if(!terminates(ys[i],2)) okv = false;
    if(okv && classifyTab(xs,ys)!==typ) okv = false;
    if(okv) break;
  } while(tries<300);
  t.xs = xs; t.ys = ys;
  return t;
}
/* unabhängige Typbestimmung (auch im Prüfskript genutzt) */
function classifyTab(xs, ys){
  var i, lin = true, exp = true, pot = false, n, s0, r0;
  s0 = (ys[1]-ys[0])/(xs[1]-xs[0]);
  for(i=1;i<xs.length;i++) if(!near((ys[i]-ys[i-1])/(xs[i]-xs[i-1]), s0, 1e-7)) lin = false;
  for(i=1;i<xs.length;i++){
    if(ys[i-1]===0 || ys[i]<=0){ exp = false; break; }
    r0 = Math.pow(ys[1]/ys[0], 1/(xs[1]-xs[0]));
    if(!near(Math.pow(ys[i]/ys[i-1], 1/(xs[i]-xs[i-1])), r0, 1e-7)) exp = false;
  }
  for(n=-4;n<=4;n++){
    if(n===0) continue;
    var ok = xs[0]!==0, a0 = ys[0]/Math.pow(xs[0],n);
    for(i=1;i<xs.length && ok;i++) if(xs[i]===0 || !near(ys[i]/Math.pow(xs[i],n), a0, 1e-7*Math.max(1,Math.abs(a0)))) ok = false;
    if(ok && n!==1){ pot = true; }
  }
  if(lin && !exp && !pot) return 'lin';
  if(exp && !lin && !pot) return 'exp';
  if(pot && !lin && !exp) return 'pot';
  return 'unklar';
}
function tabH(t, xn, yn){
  return tbl([[xn||mv('x')].concat(t.xs.map(function(x){ return nf(x); })), [yn||fx('f')].concat(t.ys.map(function(y){ return nf(y); }))]);
}
/* Begründung mit Pfeilen */
function tabReason(t){
  var xs = t.xs, ys = t.ys;
  if(t.typ==='lin'){
    var dx = xs[1]-xs[0];
    return mv('x')+' plus '+nf(dx)+' &rarr; '+mv('y')+' '+(ys[1]>=ys[0] ? 'plus '+nf(ys[1]-ys[0]) : 'minus '+nf(ys[0]-ys[1]))+' (immer gleich). Gleiche Differenzen: linear.';
  }
  if(t.typ==='exp'){
    var d = xs[1]-xs[0], f = ys[1]/ys[0];
    return mv('x')+' plus '+nf(d)+' &rarr; '+mv('y')+' mal '+vH(f)+' (immer gleich). Gleiche Quotienten: exponentiell.';
  }
  var i, k = -1;
  for(i=1;i<xs.length;i++) if(xs.indexOf(xs[i]*2)>=0 || xs.indexOf(xs[0]*2)>=0){ k = 1; break; }
  var x1 = xs[0], x2 = x1*2;
  if(xs.indexOf(x2)<0){ x1 = xs[1]; x2 = x1*2; }
  if(xs.indexOf(x2)<0){ x1 = 1; x2 = 2; }
  return mv('x')+' mal 2 &rarr; '+mv('y')+' mal '+vH(Math.pow(2,t.n))+' (zum Beispiel '+nf(x1)+' &rarr; '+nf(x2)+'). Gleicher Faktor bei '+mv('x')+' mal 2: potenziell.';
}
function eqOf(t, name){
  if(t.typ==='lin') return linH(t.m, t.b, name||'f', 'dec');
  if(t.typ==='exp') return expH(t.a, t.bb, name||'f');
  return potH(t.a, t.n, name||'f');
}

/* ---------- W1 Wachstumsart erkennen ---------- */
function genW1(L){
  var n = (L===1) ? 2 : 3, typs = [], i, tabs = [];
  do{
    typs = [];

  } while(L>1 && typs[0]===typs[1] && typs[1]===typs[2]);
  if(L===3 && typs.indexOf('pot')<0) typs[rnd(3)] = 'pot';
  for(i=0;i<n;i++) tabs.push(makeTab(typs[i], L));
  var names = ['A','B','C'];
  var body = '<p>Jede Tabelle gehört zu genau einer Wachstumsart. Eine Abnahme zählt auch als Wachstum.</p>';
  var specs = [], ans = {}, steps = [];
  for(i=0;i<n;i++){
    body += '<div class="tabblock"><div class="tabname">Tabelle '+names[i]+'</div>'+tabH(tabs[i])+segc('t'+(i+1), TYPOPT)+'</div>';
    var dd = {};
    dd[tabs[i].typ==='lin' ? 'exp' : 'lin'] = 'Tabelle '+names[i]+': Vergleiche Differenzen und Quotienten benachbarter '+mv('y')+'-Werte.';
    dd[tabs[i].typ==='pot' ? 'exp' : 'pot'] = 'Tabelle '+names[i]+': '+(tabs[i].typ==='pot' ? 'Achte darauf, wie die '+mv('x')+'-Werte wachsen: plus 1 oder mal 2?' : 'Bei potenziellem Wachstum gilt: '+mv('x')+' mal 2 &rarr; '+mv('y')+' immer mit demselben Faktor. Prüfe das.');
    if(tabs[i].typ==='pot') dd.lin = 'Tabelle '+names[i]+': Die Differenzen sind nicht gleich. Prüfe '+mv('x')+' mal 2.';
    specs.push({k:'t'+(i+1), c:tabs[i].typ, d:dd});
    ans['t'+(i+1)] = tabs[i].typ;
    steps.push('Tabelle '+names[i]+': '+tabReason(tabs[i])+' Gleichung: '+eqOf(tabs[i])+'.');
