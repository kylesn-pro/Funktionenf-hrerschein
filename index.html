    specs = [{k:'a2', x:a2, lab:'A', d:[[A0*Math.pow(1+d/A0,2),'A wächst linear: jede '+tn+' plus '+nf(d)+'.']], miss:nf(A0)+' + 2 &middot; '+nf(d)+'.'},
             {k:'b2', x:b2, tol:terminates(b2,2) ? 0 : 0.51, lab:'B', d:[[B0+2*B0*p/100,'B wächst um '+nf(p)+'&thinsp;% vom jeweils aktuellen Wert, nicht vom Anfangswert.'],[B0*b*2,'Rechne '+msup(nf(b),'2')+', nicht '+nf(b)+' &middot; 2.']], miss:nf(B0)+' &middot; '+msup(nf(b),'2')+'.'},
             {k:'vorn', c:(b2>a2 ? 'B' : 'A'), d:{A:'Vergleiche deine beiden Werte.', B:'Vergleiche deine beiden Werte.'}}];
    ans = {a2:ansStr(a2), b2:ansStr(rd(b2,2)), vorn:(b2>a2 ? 'B' : 'A')};
    steps = ['A nach 2 '+c.tp+': '+nf(A0)+' + 2 &middot; '+nf(d)+' = '+nf(a2)+'.', 'B nach 2 '+c.tp+': '+nf(B0)+' &middot; '+msup(nf(b),'2')+' = '+nf(b2)+'.', (b2>a2 ? 'B' : 'A')+' liegt vorn. Ab '+tn+' '+nf(ts)+' hat B dauerhaft mehr.'];
  } else {
    body = '<p>'+txt+'</p>'
      + (L===3 ? '<p><b>Stelle</b> für beide eine Funktionsgleichung <b>auf</b> ('+mv('t')+' in '+c.tp+'). ' : '<p>')
      + '<b>Bestimme</b> mit einer Wertetabelle, ab welcher '+tn+' B erstmals mehr hat als A.</p>'
      + (L===3 ? '<div class="ansatz"><span class="anl">A</span>'+fx('A',mv('t'))+' = '+inp('am','narrow')+' '+mv('t')+' + '+inp('ab','narrow')+'</div><div class="ansatz"><span class="anl">B</span>'+fx('B',mv('t'))+' = '+inp('ba','narrow')+' &middot; '+inp('bb','narrow')+'<sup class="supin">'+mv('t')+'</sup></div>' : '')
      + fields(fld('ab '+tn,'ts'));
    specs = [];
    ans = {};
    if(L===3){
      specs.push({k:'am', x:d, lab:'die Steigung von A', d:[[A0,'Steigung und Anfangswert vertauscht.']], miss:'Zuwachs pro '+tn+'.'});
      specs.push({k:'ab', x:A0, lab:'den Anfangswert von A', d:[[d,'Steigung und Anfangswert vertauscht.']], miss:'Startwert von A.'});
      specs.push({k:'ba', x:B0, lab:'den Anfangswert von B', d:[], miss:'Startwert von B.'});
      specs.push({k:'bb', x:b, lab:'den Faktor von B', d:[[p/100,nf(p)+'&thinsp;% Zuwachs heißt Faktor 1 + '+nf(p/100)+'.'],[p,nf(p)+'&thinsp;% Zuwachs heißt Faktor 1 + '+nf(p/100)+'.']], miss:'Faktor = 1 + '+mfrac(nf(p),'100')+'.'});
      ans.am = ansStr(d); ans.ab = ansStr(A0); ans.ba = ansStr(B0); ans.bb = ansStr(b);
    }
    specs.push({k:'ts', x:ts, lab:'die '+tn, d:[[ts-1,'In dieser '+tn+' liegt A noch knapp vorn. Rechne genau nach.'],[ts+1,'Schon eine '+tn+' früher hat B mehr.']], miss:'Lege eine Tabelle für '+mv('t')+' = 1, 2, 3, … an.'});
    ans.ts = String(ts);
    var tabl = [];
    for(t=Math.max(1,ts-2); t<=ts; t++) tabl.push(mv('t')+' = '+nf(t)+': A = '+nf(A0+d*t)+', B &asymp; '+nf(B0*Math.pow(b,t),0));
    steps = ['Gleichungen: '+eqA+' und '+eqB+'.', tabl.join('; ')+'.', 'Ab '+tn+' '+nf(ts)+' hat B mehr. Danach bleibt B vorn: A wächst immer um '+nf(d)+', B um '+nf(p)+'&thinsp;% eines immer größeren Werts.'];
  }
  return mkTask({
    type:'M4', level:L, op:L===1 ? 'Berechne' : 'Bestimme', title:'Linear gegen exponentiell', body:body,
    hints:['A wächst linear (immer plus '+nf(d)+'), B exponentiell (immer mal '+nf(b)+').', 'Gleichungen: '+eqA+' und '+eqB+'.', 'Rechne beide Werte für '+mv('t')+' = 1, 2, 3, … aus und vergleiche.'],
    sol: ol(steps), specs:specs, okMsg:'Richtig gerechnet.', ans:ans,
    data:{A0:A0, d:d, B0:B0, p:p, ts:ts, L:L},
    sig:'M4|'+c.id+'|'+L+'|'+[A0,d,B0,p].join(',')
  });
}

/* ---------- M5 Modell aus Messwerten ---------- */
var M5CTX = [
  {id:'blume', t:'Die Höhe einer jungen Sonnenblume wird wöchentlich gemessen.', xn:'Zeit in Wochen', yn:'Höhe in cm', u:'cm', tn:'Woche', tns:'Wochen', lim:300, limT:'Sonnenblumen werden meist 2 bis 3 m hoch', thr:[100,150,200,250]},
  {id:'schale', t:'In einer Petrischale wächst ein Bakterienrasen. Seine Fläche wird täglich gemessen.', xn:'Zeit in Tagen', yn:'Fläche in cm²', u:'cm²', tn:'Tag', tns:'Tagen', lim:64, limT:'die Petrischale hat nur etwa 64&thinsp;cm² Fläche', thr:[20,25,30,40,50]},
  {id:'alge', t:'Auf einem kleinen Teich breitet sich ein Algenteppich aus. Seine Fläche wird wöchentlich gemessen.', xn:'Zeit in Wochen', yn:'Fläche in m²', u:'m²', tn:'Woche', tns:'Wochen', lim:400, limT:'der Teich ist nur 400&thinsp;m² groß', thr:[100,150,200,250,300]}
];
function genM5(L){
  var c = pick(M5CTX), a, b, ys, i, bref, thr, wk, tries = 0, ok, body, specs, ans, steps;
  do{
    tries++; ok = true;
    if(L===1){ a = (c.id==='schale') ? pick([0.5,1,2,4]) : pick([2,4,5,8,10,16,20,25,32,40]); b = pick([1.2,1.25,1.5,2,2.5,3,1.1]); }
    else if(c.id==='schale'){ a = pick([0.5,1,1.5,2]); b = pick([1.4,1.5,1.6,1.8,2]); }
    else { a = pick([4,5,6,8,10,12]); b = pick([1.3,1.4,1.5,1.6,1.8]); }
    ys = [a];
    for(i=1;i<=4;i++){
      var e = (L===1) ? 0 : (rnd(2) ? 1 : -1)*ri(0,3)/100;
      ys.push(L===1 ? rd(a*Math.pow(b,i),6) : rd(a*Math.pow(b,i)*(1+e), c.id==='schale' ? 1 : 0));
    }
    if(L===1){ for(i=0;i<ys.length;i++) if(!terminates(ys[i],2)) ok = false; if(ys[4]>c.lim) ok = false; bref = b; }
    else bref = Math.pow(ys[4]/ys[0], 0.25);
    var lo = bref-0.03, hi = bref+0.03;
    var qs = []; for(i=1;i<=4;i++) qs.push(ys[i]/ys[i-1]);
    if(L>1){
      if(Math.max.apply(null,qs) - Math.min.apply(null,qs) > 0.12) ok = false;
      thr = pick(c.thr);
      var w1 = Math.ceil(Math.log(thr/a)/Math.log(hi)-1e-9), w2 = Math.ceil(Math.log(thr/a)/Math.log(lo)-1e-9);
      if(w1!==w2 || w1<=4 || w1>14) ok = false;
      /* auch der Mittelwert der Quotienten soll zur selben Woche führen */
      var qm = (qs[0]+qs[1]+qs[2]+qs[3])/4;
      if(Math.abs(qm-bref)>0.03) ok = false;
      wk = w1;
      if(Math.pow(lo,wk)*a<=thr*1.01 && Math.pow(lo,wk)*a>thr) ok = false;
    }
  } while(!ok && tries<800);
  var tb = tbl([[c.xn,'0','1','2','3','4'],[c.yn].concat(ys.map(function(y){ return nf(y); }))]);
  if(L===1){
    var t6 = 6, y6 = a*Math.pow(b,t6), tol6 = terminates(y6,2) ? 0 : 0.051;
    body = '<p>'+c.t+'</p>'+tb+'<p><b>Bestimme</b> den Wachstumsfaktor '+mv('b')+'. <b>Berechne</b> mit dem Modell '+fx('f',mv('t'))+' = '+nf(a)+' &middot; '+msup(mv('b'),mv('t'))+' den Wert nach 6 '+c.tns+'.</p>'
      + fields(fld(mv('b')+' =','b'), fld('nach 6 '+c.tns,'y',c.u)) + (tol6>0 ? '<p class="hintline">Runde auf eine Nachkommastelle.</p>' : '');
    specs = [{k:'b', x:b, lab:mv('b'), d:[[ys[1]-ys[0],'Das ist eine Differenz. Exponentielles Wachstum erkennt man an gleichen Quotienten.'],[1/b,'Teile den späteren Wert durch den früheren.']], miss:mv('b')+' = '+mfrac(nf(ys[1]),nf(ys[0]))+'.'},
             {k:'y', x:y6, tol:tol6, lab:'den Wert', d:[[ys[4]+2*(ys[4]-ys[3]),'Das wäre lineares Weiterrechnen. Multipliziere weiter mit '+nf(b)+'.']], miss:nf(a)+' &middot; '+msup(nf(b),'6')+'.'}];
    ans = {b:ansStr(b), y:tol6>0 ? nf(y6,1).replace(MINUS,'-').replace(/ /g,'') : ansStr(y6)};
    steps = ['Quotienten: '+[1,2,3,4].map(function(i){ return mfrac(nf(ys[i]),nf(ys[i-1]))+' = '+nf(ys[i]/ys[i-1]); }).join(', ')+'. Immer gleich, also '+mv('b')+' = '+nf(b)+'.', fx('f','6')+' = '+nf(a)+' &middot; '+msup(nf(b),'6')+' = '+(tol6>0 ? '&asymp; '+nf(y6,1) : nf(y6))+U(c.u)+'.'];
  } else {
    var q12 = a*Math.pow(bref,12), real = q12<=c.lim;
    body = '<p>'+c.t+'</p>'+tb
      + '<p><b>Begründe</b> für dich, dass die Werte näherungsweise exponentiell wachsen. <b>Bestimme</b> einen passenden Wachstumsfaktor '+mv('b')+' (zwei Nachkommastellen) für das Modell '+fx('f',mv('t'))+' = '+nf(a)+' &middot; '+msup(mv('b'),mv('t'))+'. <b>Bestimme</b> damit, in welcher '+c.tn+' erstmals '+q(thr,c.u)+' überschritten werden.</p>'
      + fields(fld(mv('b')+' &asymp;','b'), fld('in '+c.tn,'w'))
      + (L===3 ? '<p><b>Beurteile</b>, ob das Modell auch nach 12 '+c.tns+' noch passt.</p>'+segc('real',[['ja','Modell passt noch'],['nein','Modell passt nicht mehr']]) : '');
    specs = [{k:'b', x:bref, tol:0.031, lab:mv('b'), d:[[ys[1]-ys[0],'Bilde Quotienten, keine Differenzen.']], miss:'Bilde die Quotienten benachbarter Werte und nimm einen mittleren Wert.'},
             {k:'w', x:wk, lab:'die '+c.tn, d:[[wk-1,'In dieser '+c.tn+' ist der Wert noch knapp darunter.']], miss:'Rechne '+nf(a)+' &middot; '+msup(mv('b'),mv('t'))+' für '+mv('t')+' = 5, 6, 7, … aus.'}];
    ans = {b:nf(bref,2).replace(MINUS,'-'), w:String(wk)};
    if(L===3){ specs.push({k:'real', c:(real ? 'ja' : 'nein'), d:{ja:'Rechne '+fx('f','12')+' aus und vergleiche: '+c.limT+'.', nein:'Rechne '+fx('f','12')+' aus und vergleiche.'}}); ans.real = real ? 'ja' : 'nein'; }
    steps = ['Quotienten: '+[1,2,3,4].map(function(i){ return nf(ys[i]/ys[i-1],2); }).join(', ')+'. Fast gleich, also näherungsweise exponentiell.', mv('b')+' &asymp; '+nf(bref,2)+' (Mittelwert der Quotienten oder '+msup('('+mfrac(nf(ys[4]),nf(ys[0]))+')', mfrac('1','4'))+'; alles zwischen '+nf(bref-0.03,2)+' und '+nf(bref+0.03,2)+' zählt).', fx('f',nf(wk-1))+' &asymp; '+nf(a*Math.pow(bref,wk-1),0)+', '+fx('f',nf(wk))+' &asymp; '+nf(a*Math.pow(bref,wk),0)+'. Erstmals über '+nf(thr)+' in '+c.tn+' '+nf(wk)+'.'];
    if(L===3) steps.push(fx('f','12')+' &asymp; '+q(q12,c.u,0)+'. '+(real ? 'Das ist noch möglich.' : 'Das ist unrealistisch, denn '+c.limT+'. Das Modell beschreibt nur die erste Wachstumsphase.'));
  }
  return mkTask({
    type:'M5', level:L, op:'Bestimme', title:'Modell aus Messwerten', body:body,
    hints:['Exponentiell heißt: Bei gleichen Zeitschritten wird ungefähr mit demselben Faktor multipliziert.', 'Berechne die Quotienten '+mfrac(nf(ys[1]),nf(ys[0]))+', '+mfrac(nf(ys[2]),nf(ys[1]))+', … und nimm einen mittleren Wert.', L===1 ? 'Setze '+mv('t')+' = 6 in '+nf(a)+' &middot; '+msup(mv('b'),mv('t'))+' ein.' : 'Probiere '+mv('t')+' = 5, 6, 7, … in '+nf(a)+' &middot; '+msup(mv('b'),mv('t'))+' aus.'],
    sol: ol(steps), specs:specs, okMsg:'Gut modelliert.', ans:ans,
    data:{a:a, ys:ys, bref:bref, thr:thr, wk:wk, L:L},
    sig:'M5|'+c.id+'|'+L+'|'+ys.join(',')+'|'+thr
  });
}

/* ---------- M6 Fehler finden: Modelle ---------- */
function genM6(L){
  var v = (L===1) ? pick(['faktor','halb2']) : (L===2 ? pick(['lukas','zins2']) : pick(['kepler','xhoch']));
  var o = {type:'M6', level:L, op:'Beurteile', title:'Fehler finden: Wachstum'}, opts, p, a, T;
  var who = pick(['Lukas','Hanna','Ole','Selin','Tim','Jule']);
  if(v==='faktor'){
    p = pick([10,15,20,25,30,40]); a = pick([200,400,500,800]);
    o.body = '<p>Ein Wirkstoff wird im Körper abgebaut: pro Stunde '+nf(p)+'&thinsp;% der vorhandenen Menge. Zu Beginn sind es '+q(a,'mg')+'. '+who+' stellt auf: '+expH(a,p/100,'f','t')+'.</p><p><b>Beurteile</b> die Gleichung.</p>';
    opts = [{h:'Falsch. Werden '+nf(p)+'&thinsp;% abgebaut, bleiben '+nf(100-p)+'&thinsp;%. Richtig ist '+expH(a,1-p/100,'f','t')+'.', ok:true},
      {h:'Richtig. Der Faktor ist immer der Prozentsatz als Dezimalzahl.', ok:false, why:'Dann wären nach einer Stunde nur noch '+nf(p)+'&thinsp;% übrig.'},
      {h:'Falsch. Richtig ist '+expH(a,1+p/100,'f','t')+'.', ok:false, why:'Das wäre eine Zunahme.'},
      {h:'Falsch. Richtig ist '+linH(-p/100*a, a, 'f', 'dec', 't')+'.', ok:false, why:'Es werden '+nf(p)+'&thinsp;% vom jeweils vorhandenen Wert abgebaut, nicht immer gleich viel.'}];
    o.sol = ol(['Abbau '+nf(p)+'&thinsp;% heißt: '+nf(100-p)+'&thinsp;% bleiben.', 'Faktor '+nf(1-p/100)+', also '+expH(a,1-p/100,'f','t')+'.']);
    o.sig = 'M6f|'+p+'|'+a;
  } else if(v==='halb2'){
    T = pick([2,5,6,8]); a = pick([80,100,160,200]);
    o.body = '<p>Ein Stoff hat eine Halbwertszeit von '+nf(T)+' Stunden. Zu Beginn sind '+q(a,'mg')+' vorhanden. '+who+' sagt: „Nach '+nf(T)+' Stunden ist die Hälfte weg, nach '+nf(2*T)+' Stunden also alles.“</p><p><b>Beurteile</b> die Aussage.</p>';
    opts = [{h:'Falsch. In jeder Halbwertszeit halbiert sich die noch vorhandene Menge: '+nf(a)+' &rarr; '+nf(a/2)+' &rarr; '+nf(a/4)+'. Nach '+nf(2*T)+' Stunden ist noch ein Viertel da.', ok:true},
      {h:'Richtig. Zweimal die Hälfte ergibt das Ganze.', ok:false, why:'Die zweite Hälfte bezieht sich auf die verbleibende Menge.'},
      {h:'Falsch. Nach '+nf(2*T)+' Stunden ist noch die Hälfte da.', ok:false, why:'Nach '+nf(T)+' Stunden ist es die Hälfte, danach weniger.'},
      {h:'Falsch. Nach '+nf(2*T)+' Stunden ist alles verdoppelt.', ok:false, why:'Der Stoff wird abgebaut, nicht vermehrt.'}];
    o.sol = ol([nf(a)+' &rarr; '+nf(a/2)+' (nach '+nf(T)+' h) &rarr; '+nf(a/4)+' (nach '+nf(2*T)+' h).', 'Exponentieller Abbau erreicht nie genau 0.']);
    o.sig = 'M6h|'+T+'|'+a;
  } else if(v==='lukas'){
    p = pick([20,25,10]); a = pick([200,300,400,500,600,800,1000]);
    var n = 100/p, rest = a*Math.pow(1-p/100,n);
    o.body = '<p>Ein Patient erhält '+q(a,'mg')+' eines Wirkstoffs. Pro Stunde werden '+nf(p)+'&thinsp;% der noch vorhandenen Menge abgebaut. '+who+' sagt: „Nach '+nf(n)+' Stunden ist alles abgebaut, denn '+nf(n)+' &middot; '+nf(p)+'&thinsp;% = 100&thinsp;%.“</p><p><b>Beurteile</b> die Aussage.</p>';
    opts = [{h:'Falsch. Es werden '+nf(p)+'&thinsp;% vom jeweils vorhandenen Rest abgebaut: '+nf(a)+' &middot; '+msup(nf(1-p/100),nf(n))+' &asymp; '+q(rest,'mg',1)+' bleiben übrig.', ok:true},
      {h:'Richtig. Prozente darf man über mehrere Stunden addieren.', ok:false, why:'Nur bei gleichbleibendem Grundwert. Hier wird der Grundwert kleiner.'},
      {h:'Falsch. Es ist sogar schon nach '+nf(n-1)+' Stunden alles abgebaut.', ok:false, why:'Rechne nach: Es bleibt immer ein Rest.'},
      {h:'Falsch. Nach '+nf(n)+' Stunden ist noch die Hälfte da.', ok:false, why:'Rechne nach: '+msup(nf(1-p/100),nf(n))+' &asymp; '+nf(Math.pow(1-p/100,n),3)+'.'}];
    o.sol = ol(['Faktor pro Stunde: '+nf(1-p/100)+'.', 'Nach '+nf(n)+' Stunden: '+nf(a)+' &middot; '+msup(nf(1-p/100),nf(n))+' &asymp; '+q(rest,'mg',1)+'.']);
    o.sig = 'M6l|'+p+'|'+a;
  } else if(v==='zins2'){
    p = pick([10,20,25,30,40,50]); a = pick([50,100,200,400,500,1000]);
    var two = a*Math.pow(1+p/100,2);
    o.body = '<p>Eine Fläche von '+q(a,'m²')+' wächst jede Woche um '+nf(p)+'&thinsp;%. '+who+' sagt: „Nach zwei Wochen ist sie um '+nf(2*p)+'&thinsp;% gewachsen, also '+q(a*(1+2*p/100),'m²')+' groß.“</p><p><b>Beurteile</b> die Aussage.</p>';
    opts = [{h:'Falsch. In der zweiten Woche wächst schon die größere Fläche: '+nf(a)+' &middot; '+msup(nf(1+p/100),'2')+' = '+q(two,'m²')+'. Das sind '+nf((Math.pow(1+p/100,2)-1)*100)+'&thinsp;% mehr.', ok:true},
      {h:'Richtig. Zweimal '+nf(p)+'&thinsp;% sind '+nf(2*p)+'&thinsp;%.', ok:false, why:'Die zweite Zunahme bezieht sich auf den neuen, größeren Wert.'},
      {h:'Falsch. Es sind genau '+nf(p)+'&thinsp;%, weil der Prozentsatz gleich bleibt.', ok:false, why:'Pro Woche '+nf(p)+'&thinsp;%, über zwei Wochen mehr.'},
      {h:'Falsch. Es sind '+nf(p*p)+'&thinsp;%.', ok:false, why:'Die Faktoren werden multipliziert, nicht die Prozentzahlen.'}];
    o.sol = ol(['Faktor pro Woche: '+nf(1+p/100)+'.', 'Zwei Wochen: '+msup(nf(1+p/100),'2')+' = '+nf(Math.pow(1+p/100,2))+', also '+nf((Math.pow(1+p/100,2)-1)*100)+'&thinsp;% Zuwachs und '+q(two,'m²')+'.']);
    o.sig = 'M6z|'+p+'|'+a;
  } else if(v==='kepler'){
    var cs = [[fx('T',mv('d'))+' = '+msup(mv('d'),'1,5'),'Keplers Gesetz'],[fx('P',mv('m'))+' = 3,4 &middot; '+msup(mv('m'),'0,75'),'Kleibers Gesetz'],[fx('s',mv('v'))+' = 0,01 &middot; '+msup(mv('v'),'2'),'die Bremswegformel'],[fx('V',mv('r'))+' = 4,19 &middot; '+msup(mv('r'),'3'),'die Volumenformel der Kugel']];
    var cc = pick(cs);
    o.body = '<p>'+who+' sagt über '+cc[1]+' '+cc[0]+': „Da steht ein Exponent. Also ist das eine Exponentialfunktion.“</p><p><b>Beurteile</b> die Aussage.</p>';
    opts = [{h:'Falsch. Die Variable steht in der Basis, der Exponent ist eine feste Zahl. Das ist eine Potenzfunktion.', ok:true},
      {h:'Richtig. Jede Funktion mit einem Exponenten ist eine Exponentialfunktion.', ok:false, why:'Bei einer Exponentialfunktion steht die Variable im Exponenten, zum Beispiel '+msup('2',mv('x'))+'.'},
      {h:'Falsch. Es ist eine lineare Funktion.', ok:false, why:'Linear wäre der Exponent 1.'},
      {h:'Falsch. Das ist gar keine Funktion.', ok:false, why:'Jedem Wert der Variablen wird genau ein Wert zugeordnet.'}];
    o.sol = ol(['Potenzfunktion: '+mv('a')+' &middot; '+msup(mv('x'),mv('n'))+', Variable in der Basis.', 'Exponentialfunktion: '+mv('a')+' &middot; '+msup(mv('b'),mv('x'))+', Variable im Exponenten.']);
    o.sig = 'M6k|'+cs.indexOf(cc)+'|'+who;
  } else {
    var n3 = pick([2,3,4]), b3 = pick([2,3,1.5]), x0 = pick([10,20]);
    var fp = Math.pow((x0+1)/x0, n3);
    o.body = '<p>Gegeben sind '+fx('f')+' = '+msup(mv('x'),String(n3))+' und '+fx('g')+' = '+msup(nf(b3),mv('x'))+'. '+who+' sagt: „Für große '+mv('x')+' wächst '+mv('f')+' schneller, weil der Exponent '+nf(n3)+' fest ist.“</p><p><b>Beurteile</b> die Aussage. Betrachte dazu, mit welchem Faktor beide wachsen, wenn '+mv('x')+' von '+nf(x0)+' auf '+nf(x0+1)+' steigt.</p>';
    opts = [{h:'Falsch. '+mv('f')+' wächst nur mit dem Faktor '+msup('('+mfrac(nf(x0+1),nf(x0))+')',String(n3))+' &asymp; '+nf(fp,3)+', '+mv('g')+' immer mit '+nf(b3)+'. Die Exponentialfunktion überholt jede Potenzfunktion.', ok:true},
      {h:'Richtig. Potenzfunktionen wachsen immer schneller als Exponentialfunktionen.', ok:false, why:'Vergleiche die Faktoren: '+nf(fp,3)+' gegen '+nf(b3)+'.'},
      {h:'Falsch. Beide wachsen gleich schnell, weil beide einen Exponenten haben.', ok:false, why:'Die Faktoren sind verschieden.'},
      {h:'Falsch. '+mv('f')+' wächst mit dem Faktor '+nf(n3)+', '+mv('g')+' mit '+nf(b3)+'.', ok:false, why:'Bei '+mv('x')+' plus 1 wächst '+mv('f')+' mit '+msup('('+mfrac(nf(x0+1),nf(x0))+')',String(n3))+'.'}];
    o.sol = ol([mfrac(fx('f',nf(x0+1)),fx('f',nf(x0)))+' = '+msup('('+mfrac(nf(x0+1),nf(x0))+')',String(n3))+' &asymp; '+nf(fp,3)+'.', mfrac(fx('g',nf(x0+1)),fx('g',nf(x0)))+' = '+nf(b3)+'.', 'Der Faktor von '+mv('g')+' ist größer und bleibt gleich, der von '+mv('f')+' wird immer kleiner. '+mv('g')+' holt auf und überholt '+mv('f')+'.']);
    o.sig = 'M6x|'+n3+'|'+b3+'|'+x0;
  }
  o.hints = ['Rechne die Situation selbst mit Zahlen nach.', 'Achte darauf, ob sich Prozente auf den Anfangswert oder auf den jeweils aktuellen Wert beziehen.', 'Genau eine Antwort nennt den Fehler und begründet ihn mit einer Rechnung.'];
  return mcTask(o, opts);
}

var CATS = [
  {k:'stg',  n:'Steigung und Geraden',      s:'Steigung aus Punkten, Geradengleichung, Punktprobe, Prozent'},

var TYPES = [

  {c:'S2', k:'stg', n:'Geradengleichung aus zwei Punkten', g:genS2},

var KEY = 'funktionenfuehrerschein.v1';
var S, SEEN = {}, RUN = {up:0, down:0}, SESS = {n:0, first:0, neu:{}};
var LAST_TYPE = '', CUR = null, FLASH = '', VIEW = 'dash';

function freshState(){
  var st = {v:1, level:1, adaptive:true, cats:{}, types:{}, tot:{solved:0, first:0, streak:0, best:0}}, i;
  for(i=0;i<CATS.length;i++) st.cats[CATS[i].k] = {win:[], mile:0, badge:false, att:0};
  for(i=0;i<TYPES.length;i++) st.types[TYPES[i].c] = {n:0, ok:0};
  return st;
}
function load(){
  S = freshState();
  try{
    var raw = window.localStorage.getItem(KEY);
    if(raw){
      var o = JSON.parse(raw), i;
      if(o && o.v===1){
        if(typeof o.level==='number') S.level = o.level;
        if(typeof o.adaptive==='boolean') S.adaptive = o.adaptive;
        if(o.tot) S.tot = o.tot;
        for(i=0;i<CATS.length;i++) if(o.cats && o.cats[CATS[i].k]) S.cats[CATS[i].k] = o.cats[CATS[i].k];
        for(i=0;i<TYPES.length;i++) if(o.types && o.types[TYPES[i].c]) S.types[TYPES[i].c] = o.types[TYPES[i].c];
      }
    }
  }catch(e){ S = freshState(); }
}
function save(){ try{ window.localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function rawPct(k){
  var c = S.cats[k], s = 0, i;
  if(c.win.length===0) return 0;
  for(i=0;i<c.win.length;i++) s += c.win[i];
  var p = Math.round(s/Math.max(c.win.length,8)*100);
  return p<0 ? 0 : (p>100 ? 100 : p);
}
function catPct(k){ var p = rawPct(k), m = S.cats[k].mile; return p<m ? m : p; }
function overall(){ var s = 0, i; for(i=0;i<CATS.length;i++) s += catPct(CATS[i].k); return Math.round(s/CATS.length); }
function allPass(){ for(var i=0;i<CATS.length;i++) if(!S.cats[CATS[i].k].badge) return false; return true; }
function weakest(){
  var best = CATS[0], bp = 999, i, p;
  for(i=0;i<CATS.length;i++){ p = catPct(CATS[i].k); if(p<bp){ bp = p; best = CATS[i]; } }
  return best;
}
function record(t, q){
  var c = S.cats[t.cat], ty = S.types[t.type];
  c.win.push(q); while(c.win.length>14) c.win.shift();
  c.att++;
  ty.n++; if(q===1) ty.ok++;
  S.tot.solved++;
  if(q===1){ S.tot.first++; S.tot.streak++; if(S.tot.streak>S.tot.best) S.tot.best = S.tot.streak; }
  else if(q===0) S.tot.streak = 0;
  var p = rawPct(t.cat), fl = [25,50,70], i;
  for(i=0;i<fl.length;i++) if(p>=fl[i] && fl[i]>c.mile) c.mile = fl[i];
  if(p>=80 && !c.badge){ c.badge = true; SESS.neu[t.cat] = 1; }
  SESS.n++; if(q===1) SESS.first++;
  if(S.adaptive && CUR && CUR.mode==='train'){
    if(q===1){ RUN.up++; RUN.down = 0; if(RUN.up>=3 && S.level<3){ S.level++; RUN.up = 0; FLASH = 'Drei richtige Aufgaben in Folge. Ab jetzt Stufe '+S.level+'.'; } }
    else if(q===0){ RUN.down++; RUN.up = 0; if(RUN.down>=2 && S.level>1){ S.level--; RUN.down = 0; FLASH = 'Die nächsten Aufgaben kommen wieder auf Stufe '+S.level+'.'; } }
  }
  save(); updateReadi();
}

/* ---------- Aufgabenauswahl ---------- */
function pickType(filter){
  if(filter && typeOf(filter)) return filter;
  var list = [], w = [], sum = 0, i, r;
  for(i=0;i<TYPES.length;i++){
    if(filter && TYPES[i].k!==filter) continue;
    if(TYPES[i].c===LAST_TYPE && (!filter || filter.length>2)) continue;
    var g = 1/(1+0.35*S.types[TYPES[i].c].n);
    list.push(TYPES[i].c); w.push(g); sum += g;
  }
  if(list.length===0) return LAST_TYPE;
  r = Math.random()*sum;
  for(i=0;i<list.length;i++){ r -= w[i]; if(r<=0) return list[i]; }
  return list[list.length-1];
}
function makeTask(filter, level){
  var t, tries = 0, code;
  do{
    code = pickType(filter);
    t = genTask(code, level);
    tries++;
  } while(SEEN[t.sig] && tries<20);
  SEEN[t.sig] = 1; LAST_TYPE = t.type;
  return t;
}

/* ---------- Ziehwerkzeug für Geraden ---------- */
function mountDrag(){
  var svg = document.querySelector('#taskbody svg.dragplot');
  if(!svg) return;
  var mp = svg.getAttribute('data-map').split(','), i;
  for(i=0;i<mp.length;i++) mp[i] = parseFloat(mp[i]);
  var PL = mp[0], PT = mp[1], cell = mp[2], gx = mp[3], gy = mp[4], xmin = mp[5], ymax = mp[6], xmax = mp[7], ymin = mp[8];
  var hs = svg.querySelectorAll('.handle'), line = svg.querySelector('.dragline'), pos = [], active = -1;
  for(i=0;i<hs.length;i++) pos.push([parseFloat(hs[i].getAttribute('data-x')), parseFloat(hs[i].getAttribute('data-y'))]);
  function X(x){ return PL + (x-xmin)/gx*cell; }
  function Y(y){ return PT + (ymax-y)/gy*cell; }
  function place(i){ hs[i].setAttribute('transform','translate('+X(pos[i][0]).toFixed(1)+','+Y(pos[i][1]).toFixed(1)+')'); }
  function updLine(){
    var a = pos[0], b = pos[1];
    if(a[0]===b[0] && a[1]===b[1]){ line.style.display = 'none'; return; }
    line.style.display = '';
    if(a[0]===b[0]){ line.setAttribute('x1',X(a[0])); line.setAttribute('x2',X(a[0])); line.setAttribute('y1',Y(ymin-gy)); line.setAttribute('y2',Y(ymax+gy)); return; }
    var m = (b[1]-a[1])/(b[0]-a[0]), c = a[1]-m*a[0];
    line.setAttribute('x1',X(xmin-gx)); line.setAttribute('y1',Y(m*(xmin-gx)+c));
    line.setAttribute('x2',X(xmax+gx)); line.setAttribute('y2',Y(m*(xmax+gx)+c));
  }
  function write(){
    var box = document.getElementById('taskbody'), ks = ['x1','y1','x2','y2'], vs = [pos[0][0],pos[0][1],pos[1][0],pos[1][1]], j;
    for(j=0;j<4;j++){ var e = box.querySelector('input[data-k="'+ks[j]+'"]'); if(e) e.value = String(vs[j]); }
  }
  function pt(ev){
    var r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
    var px = (ev.clientX - r.left)*vb.width/r.width, py = (ev.clientY - r.top)*vb.height/r.height;
    var x = Math.round((xmin + (px-PL)/cell*gx)/gx)*gx, y = Math.round((ymax - (py-PT)/cell*gy)/gy)*gy;
    x = Math.max(xmin, Math.min(xmax, x)); y = Math.max(ymin, Math.min(ymax, y));
    return [x, y, px, py];
  }
  svg.addEventListener('pointerdown', function(ev){
    if(!CUR || CUR.done) return;
    var p = pt(ev), best = 0, bd = 1e9, j;
    for(j=0;j<2;j++){ var d = Math.pow(X(pos[j][0])-p[2],2)+Math.pow(Y(pos[j][1])-p[3],2); if(d<bd){ bd = d; best = j; } }
    active = best;
    hs[active].setAttribute('class','handle drag');
    try{ svg.setPointerCapture(ev.pointerId); }catch(e){}
    pos[active] = [p[0], p[1]]; place(active); updLine(); write();
    ev.preventDefault();
  });
  svg.addEventListener('pointermove', function(ev){
    if(active<0) return;
    var p = pt(ev);
    if(p[0]!==pos[active][0] || p[1]!==pos[active][1]){ pos[active] = [p[0], p[1]]; place(active); updLine(); write(); }
    ev.preventDefault();
  });
  function up(){ if(active>=0) hs[active].setAttribute('class','handle'); active = -1; }
  svg.addEventListener('pointerup', up);
  svg.addEventListener('pointercancel', up);
  updLine();
}

function examPlan(){
  var cats = ['stg','stg','zuo','zuo','tab','tab','tab','rate','rate','rate','mod','mod'], used = {}, out = [], i, tries;
  for(i=0;i<cats.length;i++){
    var code; tries = 0;
    do{ code = pickType(cats[i]); tries++; } while(used[code] && tries<30);
    used[code] = 1; out.push(code);
  }
  return shuffle(out);
}

/* ---------- Steuerung ---------- */
function goDash(){ show(renderDash(),'dash'); }
function goTrain(f){ show(renderTrain(f),'train'); paintActions(); }
function goExam(){ show(renderExamStart(),'exam'); paintActions(); }
function goKnow(){ show(renderKnow(),'know'); }
function handle(act, el){
  if(act==='nav'){ var v = el.getAttribute('data-v'); if(v==='dash') goDash(); else if(v==='train') goTrain(FILTER); else if(v==='exam') goExam(); else goKnow(); return; }
  if(act==='train'){ goTrain(el.getAttribute('data-f')); return; }
  if(act==='exam'){ goExam(); return; }
  if(act==='level'){ S.level = parseInt(el.getAttribute('data-l'),10); S.adaptive = false; save(); goDash(); return; }
  if(act==='adapt'){ S.adaptive = !S.adaptive; save(); goDash(); return; }
  if(act==='reset'){
    if(window.confirm('Wirklich den gesamten Fortschritt auf diesem Gerät löschen? Das lässt sich nicht rückgängig machen.')){
      S = freshState(); SESS = {n:0, first:0, neu:{}}; SEEN = {}; save(); goDash();
    }
    return;
  }
  if(act==='acc'){ var box = el.parentNode; box.className = box.className.indexOf('open')>=0 ? 'acc' : 'acc open'; return; }
  if(act==='seg'){
    if(!CUR || CUR.done) return;
    var k = el.getAttribute('data-k'), val = el.getAttribute('data-v'), wrap = el.parentNode, bs = wrap.getElementsByTagName('button'), i;
    for(i=0;i<bs.length;i++) bs[i].className = (bs[i]===el) ? 'segb on' : 'segb';
    wrap.className = 'segc';
    var hid = wrap.parentNode.querySelector('input[data-k="'+k+'"]'); if(hid) hid.value = val;
    var ws = document.getElementById('taskbody').querySelectorAll('[data-when]');
    for(i=0;i<ws.length;i++){ var pr = ws[i].getAttribute('data-when').split(':'); if(pr[0]===k) ws[i].style.display = (pr[1]===val) ? '' : 'none'; }
    return;
  }
  if(act==='opt'){ if(!CUR || CUR.done) return; CUR.sel = parseInt(el.getAttribute('data-i'),10); markOpts(); return; }
  if(act==='hint'){
    if(!CUR || CUR.done || CUR.hint>=3) return;
    document.getElementById('hints').innerHTML += '<div class="hintbox fadein"><span class="hl">Hilfe '+(CUR.hint+1)+' von 3</span>'+nb(CUR.task.hints[CUR.hint])+'</div>';
    CUR.hint++; paintActions(); return;
  }
  if(act==='solve'){
    if(!CUR || CUR.done) return;
    finishTask(0);
    showFeedback({status:'partial', head:'Lösung angesehen', msg:'Spiel dir den Lösungsweg als Film an. Rechne dann eine Aufgabe desselben Typs bewusst selbst: Sie zählt wieder voll.'});
    return;
  }
  if(act==='check'){
    if(!CUR || CUR.done) return;
    var res = evalCurrent();
    applyMarks(res.marks);
    if(res.status==='correct'){ finishTask((CUR.attempts===0 && CUR.hint===0) ? 1 : 0.5); showFeedback(res); return; }
    showFeedback(res); markOpts();
    if(res.nosel) return;
    if(res.status==='partial' && CUR.attempts===0){ CUR.attempts++; paintActions(); return; }
    CUR.attempts++;
    if(CUR.attempts>=2){ finishTask(0); showFeedback({status:'wrong', msg:res.msg+' Schau dir die Musterlösung an.'}); }
    else paintActions();
    return;
  }
  if(act==='film'){ if(CUR && CUR.task) openFilm(CUR.task,'solution'); return; }
  if(act==='method'){ if(!CUR || !CUR.task) return; openFilm(genTask(CUR.task.type, CUR.task.level),'method'); return; }
  if(act==='fclose'){ closeFilm(); return; }
  if(act==='fplay'){ filmToggle(); return; }
  if(act==='fprev'){ filmGo(FILM.i-1,false); return; }
  if(act==='fnext'){ filmGo(FILM.i+1,false); return; }
  if(act==='next'){ goTrain(FILTER); return; }
  if(act==='same'){ goTrain(CUR.task.type); return; }
  if(act==='examnext'){
    var r = evalCurrent();
    if(r.nosel && !window.confirm('Du hast hier noch nichts eingetragen. Trotzdem weiter?')) return;
    CUR.answers.push({ok:(r.status==='correct'), cat:CUR.task.cat, type:CUR.task.type, title:CUR.task.title});
    record(CUR.task, r.status==='correct' ? 1 : 0);
    if(CUR.i>=CUR.total-1){ show(renderExamResult(),'exam'); return; }
    CUR.i++; CUR.task = CUR.tasks[CUR.i]; CUR.sel = null; CUR.attempts = 0; CUR.done = false;
    show(examBodyH(),'exam'); paintActions();
    return;
  }
}
document.addEventListener('pointerdown', function(ev){
  var el = ev.target, a;
  while(el && el.getAttribute){
    a = el.getAttribute('data-act');
    if(a){ handle(a, el); return; }
    el = el.parentNode;
  }
});
document.addEventListener('keydown', function(ev){
  var t = ev.target, tag = (t && t.tagName) ? t.tagName : '';
  if(FILM.open){
    if(ev.key==='Escape'){ ev.preventDefault(); closeFilm(); }
    else if(ev.key==='ArrowRight'){ ev.preventDefault(); filmGo(FILM.i+1,false); }
    else if(ev.key==='ArrowLeft'){ ev.preventDefault(); filmGo(FILM.i-1,false); }
    return;
  }
  if(ev.key==='Enter' && tag==='INPUT'){
    ev.preventDefault();
    var b = document.querySelector('[data-act="check"]') || document.querySelector('[data-act="examnext"]') || document.querySelector('[data-act="next"]');
    if(b) handle(b.getAttribute('data-act'), b);
    return;
  }
  if((ev.key==='Enter' || ev.key===' ') && t && t.getAttribute && t.getAttribute('data-act') && tag!=='INPUT' && tag!=='SELECT'){ ev.preventDefault(); handle(t.getAttribute('data-act'), t); }
});

function dialH(p){
  var cx = 98, cy = 92, R = 62, A0 = 150, SPAN = 240, i, s = '';
  function pt(deg,r){ var a = deg*Math.PI/180; return [(cx+r*Math.cos(a)).toFixed(1), (cy+r*Math.sin(a)).toFixed(1)]; }
  function arc(from,to,r,style){ var a = pt(from,r), b = pt(to,r), big = ((to-from)>180) ? 1 : 0; return '<path d="M '+a[0]+' '+a[1]+' A '+r+' '+r+' 0 '+big+' 1 '+b[0]+' '+b[1]+'" style="'+style+'"/>'; }
  var pass = p>=80, col = pass ? '#5EE0A6' : '#3ED8E8';
  s += '<svg viewBox="0 0 196 158" width="196" height="158" role="img" aria-label="Prüfungsreife '+p+' Prozent">';
  s += arc(A0, A0+SPAN, R, 'fill:none;stroke:rgba(143,179,188,.22);stroke-width:13;stroke-linecap:round');
  for(i=0;i<=10;i++){ var deg = A0+SPAN*i/10, lang = (i%5===0), a1 = pt(deg,R-9.5), a2 = pt(deg, lang ? R-16 : R-13.5); s += '<line x1="'+a1[0]+'" y1="'+a1[1]+'" x2="'+a2[0]+'" y2="'+a2[1]+'" style="stroke:rgba(143,179,188,'+(lang ? '.6' : '.34')+');stroke-width:'+(lang ? 2 : 1.4)+';stroke-linecap:round"/>'; }
  var dg = A0+SPAN*0.8, m1 = pt(dg,R-7), m2 = pt(dg,R+7.5), lb = pt(dg,R+16);
  s += '<line x1="'+m1[0]+'" y1="'+m1[1]+'" x2="'+m2[0]+'" y2="'+m2[1]+'" style="stroke:#E8B45A;stroke-width:2.6;stroke-linecap:round"/>';
  s += '<text x="'+lb[0]+'" y="'+lb[1]+'" text-anchor="middle" style="fill:#E8B45A;font-size:10px;font-family:monospace">80</text>';
  if(p>0) s += arc(A0, A0+SPAN*Math.max(p,1.2)/100, R, 'fill:none;stroke:'+col+';stroke-width:13;stroke-linecap:round');
  var nd = A0+SPAN*p/100, n1 = pt(nd,R-10.5), n2 = pt(nd,R+10.5);
  s += '<line x1="'+n1[0]+'" y1="'+n1[1]+'" x2="'+n2[0]+'" y2="'+n2[1]+'" style="stroke:#EAF4F6;stroke-width:3.4;stroke-linecap:round"/>';
  s += '<text x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" style="fill:#EAF4F6;font-size:40px;font-family:var(--f-mono);font-weight:600">'+p+'</text>';
  s += '<text x="'+cx+'" y="'+(cy+23)+'" text-anchor="middle" style="fill:#8FB3BC;font-size:10.5px;letter-spacing:.16em;font-family:monospace">PROZENT</text>';
  s += '<text x="'+cx+'" y="'+(cy+52)+'" text-anchor="middle" style="fill:'+(pass ? '#5EE0A6' : '#8FB3BC')+';font-size:11.5px;letter-spacing:.14em;font-family:monospace">'+(pass ? 'PRÜFUNGSREIF' : 'PRÜFUNGSREIFE')+'</text></svg>';
  return s;
}

/* ---------- Bühne: Sekante wird zur Tangente ---------- */
var HERO = {raf:0, tries:0};
function heroStart(){
  var cv = document.getElementById('heroCv');
  if(!cv || !cv.getContext) return;
  var ctx = cv.getContext('2d'), W = 0, H = 0, ox, oy, sc, t0 = 0, reduce = false;
  try{ reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
  function f(x){ return 0.18*Math.pow(2,x); }
  function df(x){ return 0.18*Math.log(2)*Math.pow(2,x); }
  function fit(){
    var r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    W = r.width; H = r.height; if(W<10 || H<10) return false;
    cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);
    sc = Math.max(26, Math.min(W/9.5, H/5.2)); ox = W*0.5; oy = H*0.9;
    return true;
  }
  function X(x){ return ox + x*sc; } function Y(y){ return oy - y*sc; }
  function frame(h){
    var g = ctx.createRadialGradient(W*0.14,0,0,W*0.14,0,Math.max(W,H)*1.3);
    g.addColorStop(0,'#1C4451'); g.addColorStop(0.6,'#0E2029'); g.addColorStop(1,'#0C1B23');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle = 'rgba(120,200,215,.08)'; ctx.lineWidth = 1;
    var i;
    for(i=-10;i<=10;i++){ ctx.beginPath(); ctx.moveTo(X(i),0); ctx.lineTo(X(i),H); ctx.stroke(); }
    for(i=0;i<=8;i++){ ctx.beginPath(); ctx.moveTo(0,Y(i)); ctx.lineTo(W,Y(i)); ctx.stroke(); }
    ctx.beginPath(); ctx.strokeStyle = '#3ED8E8'; ctx.lineWidth = 2.6; ctx.globalAlpha = .9;
    var x, first = true;
    for(i=0;i<=200;i++){ x = -4 + 9.5*i/200; var y = f(x); if(Y(y)<-20) break; if(first){ ctx.moveTo(X(x),Y(y)); first = false; } else ctx.lineTo(X(x),Y(y)); }
    ctx.stroke(); ctx.globalAlpha = 1;
    var px = 2.2, py = f(px), qx = px + h, qy = f(qx), m = (qy-py)/(qx-px);
    var near0 = Math.max(0, 1 - h/0.6);
    ctx.beginPath(); ctx.strokeStyle = 'rgba(224,172,78,'+(0.55+0.4*near0)+')'; ctx.lineWidth = 2; ctx.setLineDash(near0>0.95 ? [] : [7,6]);
    ctx.moveTo(X(px-6), Y(py-6*m)); ctx.lineTo(X(px+6), Y(py+6*m)); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#EAF4F6'; ctx.beginPath(); ctx.arc(X(px),Y(py),4.2,0,6.2832); ctx.fill();
    ctx.fillStyle = '#E0AC4E'; ctx.beginPath(); ctx.arc(X(qx),Y(qy),4.2,0,6.2832); ctx.fill();
    ctx.strokeStyle = 'rgba(224,172,78,.5)'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(X(qx),Y(qy),10,0,6.2832); ctx.stroke();
  }
  if(!fit()){ if(HERO.tries++<20) window.setTimeout(heroStart,120); return; }
  HERO.tries = 0;
  if(reduce){ frame(0.8); return; }
  function tick(ts){
    if(!document.body.contains(cv)){ HERO.raf = 0; return; }
    var r = cv.getBoundingClientRect(); if(Math.abs(r.width-W)>2 || Math.abs(r.height-H)>2) fit();
    if(!t0) t0 = ts;
    var u = ((ts-t0)/1000) % 9, h;
    h = u<6 ? 2.6*Math.pow(1-u/6, 2.2)+0.0005 : (u<7.5 ? 0.0005 : 2.6*Math.pow((u-7.5)/1.5,1.5));
    frame(h);
    HERO.raf = window.requestAnimationFrame(tick);
  }
  if(HERO.raf) window.cancelAnimationFrame(HERO.raf);
  HERO.raf = window.requestAnimationFrame(tick);
}

/* ---------- Erklärfilm ---------- */
var FILM = {steps:[], i:0, playing:false, timer:0, dur:5000, open:false};
function stepsFromSolution(html){
  var d = document.createElement('div'); d.innerHTML = html;
  var li = d.getElementsByTagName('li'), out = [], i;
  for(i=0;i<li.length;i++) out.push(li[i].innerHTML);
  if(out.length===0) out.push(html);
  return out;
}
function stripInputs(html){
  return String(html).replace(/<input[^>]*type="hidden"[^>]*>/g,'').replace(/<input[^>]*>/g,'<span class="kbd">&nbsp;&nbsp;&nbsp;</span>')
    .replace(/<select[\s\S]*?<\/select>/g,'<span class="kbd">&nbsp;&nbsp;&nbsp;</span>').replace(/data-act="seg"/g,'')
    .replace(/<p class="hintline">[\s\S]*?<\/p>/g,'').replace(/<g class="handle"[\s\S]*?<\/g>/g,'');
}
function stepDur(txt){ var n = String(txt).replace(/<[^>]+>/g,'').length, d = 3400 + n*30; return d>11000 ? 11000 : d; }
function openFilm(task, kind){
  FILM.steps = stepsFromSolution(task.sol); FILM.i = 0; FILM.playing = true; FILM.open = true;
  FILM.titel = (kind==='method') ? 'Methode: '+task.title : 'Lösungsweg: '+task.title;
  FILM.unter = (kind==='method') ? 'Beispiel mit anderen Zahlen. Deine Aufgabe bleibt, wie sie ist.' : 'Deine Aufgabe, Schritt für Schritt.';
  FILM.aufgabe = (kind==='method') ? stripInputs(task.body) + (task.opts ? '<p class="note" style="margin-top:8px">Antwort: '+task.opts[task.ans.opt].h+'</p>' : '') : null;
  FILM.fig = task.solFig || '';
  var host = document.getElementById('filmHost');
  host.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="Erklärfilm"><div class="sheet-in">'
    + '<div class="film-head"><b>'+esc(FILM.titel)+'</b><span class="counter">'+esc(FILM.unter)+'</span><button type="button" class="film-x" data-act="fclose" aria-label="Film schließen">&#10005;</button></div>'
    + '<div class="film-body">'+(FILM.aufgabe ? '<div class="given">'+FILM.aufgabe+'</div>' : '')+'<div class="film-fig">'+FILM.fig+'</div><div id="filmSteps"></div></div>'
    + '<div class="film-ctrl"><button type="button" class="film-play" id="filmPlay" data-act="fplay" aria-label="Abspielen oder anhalten"></button>'
    + '<button type="button" class="film-nav" id="filmPrev" data-act="fprev" aria-label="Schritt zurück">&#8592;</button>'
    + '<button type="button" class="film-nav" id="filmNext" data-act="fnext" aria-label="Schritt vor">&#8594;</button>'
    + '<span class="film-track"><i id="filmBar"></i></span><span class="film-count" id="filmCount"></span></div></div></div>';
  document.body.className = 'locked';
  filmPaint(); filmSchedule();
}
function closeFilm(){
  if(!FILM.open) return;
  FILM.open = false; FILM.playing = false;
  if(FILM.timer){ window.clearTimeout(FILM.timer); FILM.timer = 0; }
  document.getElementById('filmHost').innerHTML = '';
  document.body.className = '';
}
function filmPaint(){
  var i, s = '';
  for(i=0;i<FILM.steps.length;i++){
    var cls = (i===FILM.i) ? 'film-step live' : (i<FILM.i ? 'film-step seen' : 'film-step');
    s += '<div class="'+cls+'"><span class="sn">Schritt '+(i+1)+'</span>'+FILM.steps[i]+'</div>';
  }
  document.getElementById('filmSteps').innerHTML = s;
  document.getElementById('filmPlay').innerHTML = FILM.playing ? pauseIcon() : playIcon();
  document.getElementById('filmCount').innerHTML = 'Schritt '+(FILM.i+1)+' von '+FILM.steps.length;
  var pv = document.getElementById('filmPrev'), nx = document.getElementById('filmNext');
  if(FILM.i<=0) pv.setAttribute('disabled','disabled'); else pv.removeAttribute('disabled');
  if(FILM.i>=FILM.steps.length-1) nx.setAttribute('disabled','disabled'); else nx.removeAttribute('disabled');
  var b = document.getElementById('filmBar'), n = FILM.steps.length;
  b.style.transition = 'none'; b.style.width = (FILM.i/n*100).toFixed(2)+'%';
  if(b.offsetWidth>=0 && FILM.playing){ b.style.transition = 'width '+FILM.dur+'ms linear'; b.style.width = ((FILM.i+1)/n*100).toFixed(2)+'%'; }
  else b.style.width = ((FILM.i+1)/n*100).toFixed(2)+'%';
}
function filmSchedule(){
  if(FILM.timer){ window.clearTimeout(FILM.timer); FILM.timer = 0; }
  if(!FILM.playing || !FILM.open) return;
  FILM.dur = stepDur(FILM.steps[FILM.i]);
  filmPaint();
  FILM.timer = window.setTimeout(function(){
    if(FILM.i>=FILM.steps.length-1){ FILM.playing = false; filmPaint(); return; }
    FILM.i++; filmSchedule();
  }, FILM.dur);
}
function filmGo(i, weiter){
  if(!FILM.open) return;
  FILM.i = Math.max(0, Math.min(FILM.steps.length-1, i));
  if(!weiter) FILM.playing = false;
  filmPaint(); filmSchedule();
}
function filmToggle(){
  if(!FILM.open) return;
  if(FILM.playing){ FILM.playing = false; if(FILM.timer){ window.clearTimeout(FILM.timer); FILM.timer = 0; } filmPaint(); return; }
  if(FILM.i>=FILM.steps.length-1) FILM.i = 0;
  FILM.playing = true; filmSchedule();
}
